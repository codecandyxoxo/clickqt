<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DUEL ROOM — 1v1 Game Room</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚔️</text></svg>">
<style>
  :root{
    --bg:#0d1117; --panel:#161d27; --panel2:#1d2634; --edge:#2b3a4e;
    --txt:#e6edf3; --dim:#8b98a9; --p1:#4dc3ff; --p2:#ff6b6b;
    --gold:#ffd166; --green:#3ddc84;
  }
  *{box-sizing:border-box; margin:0; padding:0; user-select:none; -webkit-user-select:none;}
  html,body{height:100%; background:var(--bg); color:var(--txt);
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif; overflow:hidden;}
  #wrap{height:100%; display:flex; align-items:center; justify-content:center; flex-direction:column;}
  .screen{display:none; flex-direction:column; align-items:center; gap:18px; width:min(980px,96vw);}
  .screen.on{display:flex;}
  h1.logo{font-size:56px; letter-spacing:6px; font-weight:900;
    background:linear-gradient(90deg,var(--p1),var(--p2)); -webkit-background-clip:text; background-clip:text; color:transparent;}
  .sub{color:var(--dim); margin-top:-12px; letter-spacing:2px;}
  .card{background:var(--panel); border:1px solid var(--edge); border-radius:14px; padding:24px; width:100%;}
  .row{display:flex; gap:12px; align-items:center; justify-content:center; flex-wrap:wrap;}
  input[type=text]{background:var(--panel2); border:1px solid var(--edge); color:var(--txt);
    border-radius:10px; padding:12px 16px; font-size:18px; outline:none; text-align:center; user-select:text; -webkit-user-select:text;}
  input.code{width:170px; text-transform:uppercase; letter-spacing:8px; font-weight:800; font-size:24px;}
  button{background:var(--panel2); border:1px solid var(--edge); color:var(--txt); border-radius:10px;
    padding:12px 22px; font-size:17px; font-weight:700; cursor:pointer; transition:all .12s;}
  button:hover{border-color:var(--p1); transform:translateY(-1px);}
  button.primary{background:linear-gradient(135deg,#1f6feb,#1158c7); border-color:#3b82f6;}
  button.hot{background:linear-gradient(135deg,#c73158,#eb1f4f); border-color:#f63b5f;}
  button:disabled{opacity:.45; cursor:default; transform:none;}
  .bigcode{font-size:52px; font-weight:900; letter-spacing:14px; color:var(--gold); text-align:center;}
  .hintline{color:var(--dim); font-size:14px; text-align:center;}
  .err{color:#ff8080; font-size:15px; min-height:20px; text-align:center;}
  /* lobby */
  #lobbyHead{display:flex; width:100%; justify-content:space-between; align-items:center;}
  .ptag{display:flex; align-items:center; gap:8px; font-weight:800; font-size:19px;}
  .dot{width:12px; height:12px; border-radius:50%;}
  #games{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; width:100%;}
  .gcard{background:var(--panel); border:1px solid var(--edge); border-radius:12px; padding:16px 10px;
    text-align:center; cursor:pointer; transition:all .15s;}
  .gcard:hover{border-color:var(--gold); transform:translateY(-3px); background:var(--panel2);}
  .gcard .ico{font-size:34px;}
  .gcard .nm{font-weight:800; margin-top:8px; font-size:15px;}
  .gcard .ds{color:var(--dim); font-size:11.5px; margin-top:5px; line-height:1.35;}
  .botrow{margin-top:8px; display:flex; gap:6px; justify-content:center; align-items:center;}
  .botlbl{color:var(--dim); font-size:12px;}
  .botchip{display:inline-block; width:24px; height:24px; line-height:24px; border-radius:6px;
    background:var(--panel2); border:1px solid var(--edge); font-size:13px; font-weight:800; cursor:pointer;}
  .botchip.onn{background:var(--gold); color:#222; border-color:var(--gold);}
  table#score{width:100%; border-collapse:collapse; font-size:15px;}
  #score th,#score td{padding:8px 10px; text-align:center; border-bottom:1px solid var(--edge);}
  #score th:first-child,#score td:first-child{text-align:left;}
  #score .tot{font-weight:900; font-size:17px;}
  /* game screen */
  #gamescr{position:fixed; inset:0; display:none; background:#000; z-index:5;}
  #gamescr.on{display:block;}
  #cv{position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    background:#0a0e14; border-radius:8px; box-shadow:0 0 60px rgba(0,0,0,.8);}
  #hud{position:absolute; left:50%; top:12px; transform:translateX(-50%); display:flex; gap:26px;
    align-items:center; font-weight:900; font-size:26px; z-index:6; text-shadow:0 2px 8px #000;}
  #hud .hn{font-size:15px; font-weight:700; color:var(--dim); max-width:160px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  #pingbox{position:fixed; right:14px; bottom:10px; color:var(--dim); font-size:13px; z-index:7; font-variant-numeric:tabular-nums;}
  #banner{position:absolute; left:50%; top:42%; transform:translate(-50%,-50%); font-size:64px; font-weight:900;
    letter-spacing:3px; text-shadow:0 4px 24px #000; z-index:8; pointer-events:none; text-align:center; white-space:pre-line;}
  #subbanner{position:absolute; left:50%; top:58%; transform:translate(-50%,-50%); font-size:22px; color:var(--dim);
    z-index:8; pointer-events:none; text-align:center;}
  #quitbtn{position:fixed; left:14px; top:12px; z-index:7; padding:8px 14px; font-size:14px;}
  #ctrlhint{position:fixed; left:50%; bottom:10px; transform:translateX(-50%); color:var(--dim); font-size:13.5px; z-index:7;}
  #toast{position:fixed; left:50%; top:18px; transform:translateX(-50%); background:var(--panel2);
    border:1px solid var(--edge); padding:10px 20px; border-radius:10px; z-index:99; display:none; font-weight:700;}
  .flash{animation:fl .5s;}
  @keyframes fl{0%{opacity:0; transform:translate(-50%,-50%) scale(1.6);}100%{opacity:1; transform:translate(-50%,-50%) scale(1);}}
</style>
</head>
<body>
<div id="wrap">

  <!-- MENU -->
  <div class="screen on" id="scr-menu">
    <h1 class="logo">DUEL ROOM</h1>
    <div class="sub">7 GAMES &middot; 1 RIVALRY &middot; FIRST TO 5</div>
    <div class="card">
      <div class="row" style="margin-bottom:18px">
        <label style="color:var(--dim)">Your name</label>
        <input type="text" id="nameIn" maxlength="12" placeholder="Player" style="width:200px">
      </div>
      <div class="row">
        <button class="primary" id="btnCreate">CREATE ROOM</button>
        <span style="color:var(--dim)">or</span>
        <input type="text" class="code" id="codeIn" maxlength="4" placeholder="CODE">
        <button id="btnJoin">JOIN</button>
      </div>
      <div class="err" id="menuErr" style="margin-top:14px"></div>
    </div>
    <div class="hintline">Peer-to-peer connection &middot; lowest possible ping &middot; play with a friend anywhere</div>
  </div>

  <!-- WAITING -->
  <div class="screen" id="scr-wait">
    <h1 class="logo" style="font-size:34px">ROOM READY</h1>
    <div class="card" style="text-align:center">
      <div style="color:var(--dim); margin-bottom:10px">Send this code to your friend</div>
      <div class="bigcode" id="roomCodeShow">----</div>
      <div class="hintline" style="margin-top:14px">…or send the link:</div>
      <div class="row" style="margin-top:8px">
        <input type="text" id="linkShow" readonly style="width:70%; font-size:13px; text-align:center">
        <button id="btnCopy">Copy</button>
      </div>
      <div style="margin-top:18px; color:var(--gold); font-weight:700" id="waitMsg">Waiting for opponent…</div>
    </div>
    <button id="btnCancelWait">Cancel</button>
  </div>

  <!-- LOBBY -->
  <div class="screen" id="scr-lobby">
    <div id="lobbyHead">
      <div class="ptag"><span class="dot" style="background:var(--p1)"></span><span id="lp1">P1</span></div>
      <div style="color:var(--gold); font-weight:900; letter-spacing:4px; font-size:22px">GAME LOBBY</div>
      <div class="ptag"><span id="lp2">P2</span><span class="dot" style="background:var(--p2)"></span></div>
    </div>
    <div id="games"></div>
    <div class="card" style="padding:14px 20px">
      <table id="score"></table>
    </div>
    <div class="hintline">Either player can pick a game &middot; every game is first to 5 points</div>
  </div>

</div>

<!-- GAME -->
<div id="gamescr">
  <canvas id="cv" width="960" height="540"></canvas>
  <div id="hud"></div>
  <div id="banner"></div>
  <div id="subbanner"></div>
  <button id="quitbtn">← Lobby</button>
  <div id="ctrlhint"></div>
</div>
<div id="pingbox"></div>
<div id="toast"></div>

<script>

// ---- tiny WebAudio synth SFX ----
const SFX = (() => {
  let ac = null, master = null, on = true;
  function ctx() {
    if (!ac) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ac = new AC();
      master = ac.createGain(); master.gain.value = 0.35; master.connect(ac.destination);
    }
    if (ac.state === 'suspended') ac.resume();
    return ac;
  }
  function env(g, t0, a, d, peak) {
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(peak, t0 + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + a + d);
  }
  function tone(freq, dur, type = 'sine', peak = 0.5, slideTo = null, when = 0) {
    const c = ctx(); if (!c || !on) return;
    const t0 = c.currentTime + when;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(30, slideTo), t0 + dur);
    env(g, t0, 0.005, dur, peak);
    o.connect(g); g.connect(master);
    o.start(t0); o.stop(t0 + dur + 0.1);
  }
  function noise(dur, peak = 0.5, lp = 4000, when = 0) {
    const c = ctx(); if (!c || !on) return;
    const t0 = c.currentTime + when;
    const len = Math.max(1, Math.floor(c.sampleRate * dur));
    const buf = c.createBuffer(1, len, c.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const s = c.createBufferSource(); s.buffer = buf;
    const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = lp;
    const g = c.createGain(); env(g, t0, 0.003, dur, peak);
    s.connect(f); f.connect(g); g.connect(master);
    s.start(t0); s.stop(t0 + dur + 0.05);
  }
  return {
    unlock() { ctx(); },
    click()      { tone(1200, 0.05, 'square', 0.15); },
    beep()       { tone(660, 0.10, 'square', 0.3); },
    go()         { tone(880, 0.20, 'square', 0.4); tone(1320, 0.25, 'square', 0.25, null, 0.02); },
    shoot()      { noise(0.16, 0.6, 6000); tone(180, 0.14, 'sawtooth', 0.35, 60); },
    hit()        { tone(300, 0.2, 'sawtooth', 0.5, 80); noise(0.15, 0.4, 2500); },
    bounce()     { tone(340, 0.06, 'square', 0.25, 250); },
    paddle()     { tone(500, 0.06, 'square', 0.35, 420); },
    putt()       { noise(0.05, 0.35, 1800); tone(190, 0.06, 'sine', 0.3); },
    sink()       { tone(523, 0.12, 'sine', 0.4); tone(659, 0.12, 'sine', 0.4, null, 0.09); tone(784, 0.25, 'sine', 0.4, null, 0.18); },
    tank()       { noise(0.2, 0.55, 3000); tone(120, 0.18, 'sawtooth', 0.4, 50); },
    boom()       { noise(0.5, 0.8, 1200); tone(90, 0.4, 'sine', 0.6, 35); },
    draw()       { tone(1500, 0.35, 'square', 0.5); },
    point()      { tone(700, 0.1, 'square', 0.35); tone(1050, 0.16, 'square', 0.35, null, 0.08); },
    losePoint()  { tone(300, 0.18, 'square', 0.3, 180); },
    win()        { [523,659,784,1047].forEach((f,i)=>tone(f,0.22,'square',0.35,null,i*0.13)); },
    lose()       { [400,350,300,220].forEach((f,i)=>tone(f,0.22,'sawtooth',0.25,null,i*0.15)); },
    tick()       { tone(880, 0.03, 'square', 0.12); },
  };
})();

// ---- SNIPER DUEL: top-down one-shot arena ----
regGame('sniper', (() => {
  let E, walls, me, foe, foeI, tracers, flashes, reload, shotsFired;
  const SPEED = 185, R = 13, RELOAD = 1.4;

  function genWalls(rand) {
    const W = 960, H = 540, T = 16;
    const w = [
      [0, 0, W, T], [0, H - T, W, T], [0, 0, T, H], [W - T, 0, T, H],
      [W / 2 - 10, H / 2 - 70, 20, 140], // center pillar
    ];
    // seeded obstacles on left half, mirrored to right half
    for (let i = 0; i < 4; i++) {
      const bw = 30 + rand() * 90, bh = 30 + rand() * 90;
      const x = 90 + rand() * (W / 2 - 220), y = 50 + rand() * (H - 140 - bh);
      w.push([x, y, bw, bh]);
      w.push([W - x - bw, y, bw, bh]);
    }
    return w;
  }

  function collide(p) {
    for (const [x, y, w2, h] of walls) {
      const c = circleRect(p.x, p.y, R, x, y, w2, h);
      if (c) { p.x = c.x; p.y = c.y; }
    }
  }

  function castWall(ox, oy, dx, dy) {
    let t = 2000;
    for (const [x, y, w2, h] of walls) t = Math.min(t, rayRect(ox, oy, dx, dy, x, y, w2, h));
    return t;
  }

  return {
    name: 'Sniper Duel', ico: '🎯',
    desc: 'One shot, one point. Dodge the laser.',
    controls: 'WASD move · mouse aim · click to fire · 1 hit = 1 point',

    init(e) { E = e; },

    newRound() {
      walls = genWalls(E.rand);
      const sx = E.me === 0 ? 60 : 900;
      me = { x: sx, y: 270, a: E.me === 0 ? 0 : Math.PI };
      foe = makeInterp();
      foeI = null;
      tracers = []; flashes = [];
      reload = 0; shotsFired = 0;
      this._lastSent = 0;
    },

    update(dt) {
      // aim
      me.a = Math.atan2(E.mouse.y - me.y, E.mouse.x - me.x);
      if (E.playing) {
        let vx = 0, vy = 0;
        if (E.keys.has('w')) vy -= 1; if (E.keys.has('s')) vy += 1;
        if (E.keys.has('a')) vx -= 1; if (E.keys.has('d')) vx += 1;
        if (vx || vy) { const l = Math.hypot(vx, vy); me.x += (vx / l) * SPEED * dt; me.y += (vy / l) * SPEED * dt; }
        collide(me);
        reload = Math.max(0, reload - dt);
      }
      // stream position 30Hz
      this._lastSent += dt;
      if (this._lastSent > 1 / 30) {
        this._lastSent = 0;
        E.gsend({ p: [Math.round(me.x), Math.round(me.y), +me.a.toFixed(2)] });
      }
      foeI = foe.get(['x', 'y'], ['a']);
      tracers = tracers.filter((t) => (t.life -= dt) > 0);
      flashes = flashes.filter((f) => (f.life -= dt) > 0);
    },

    onDown() {
      if (!E.playing || reload > 0) return;
      reload = RELOAD; shotsFired++;
      const dx = Math.cos(me.a), dy = Math.sin(me.a);
      const tw = castWall(me.x, me.y, dx, dy);
      let hit = false, tEnd = tw;
      if (foeI) {
        const tc = rayCircle(me.x, me.y, dx, dy, foeI.x, foeI.y, R + 2);
        if (tc < tw) { hit = true; tEnd = tc; }
      }
      tracers.push({ x1: me.x, y1: me.y, x2: me.x + dx * tEnd, y2: me.y + dy * tEnd, life: 0.25, c: E.colors[E.me] });
      SFX.shoot();
      E.gsend({ shot: [Math.round(me.x), Math.round(me.y), +me.a.toFixed(3), Math.round(tEnd), hit ? 1 : 0] });
      if (hit) {
        flashes.push({ x: foeI.x, y: foeI.y, life: 0.4 });
        SFX.hit();
        E.claimPoint(E.me);
      }
    },

    onNet(d) {
      if (d.p) foe.push({ x: d.p[0], y: d.p[1], a: d.p[2] });
      if (d.shot) {
        const [x, y, a, t, hit] = d.shot;
        tracers.push({ x1: x, y1: y, x2: x + Math.cos(a) * t, y2: y + Math.sin(a) * t, life: 0.25, c: E.colors[1 - E.me] });
        SFX.shoot();
        if (hit) { flashes.push({ x: me.x, y: me.y, life: 0.4 }); SFX.hit(); }
      }
    },

    draw() {
      const c = E.ctx;
      c.fillStyle = '#101820'; c.fillRect(0, 0, 960, 540);
      // floor grid
      c.strokeStyle = 'rgba(255,255,255,0.03)'; c.lineWidth = 1;
      for (let x = 0; x < 960; x += 48) { c.beginPath(); c.moveTo(x, 0); c.lineTo(x, 540); c.stroke(); }
      for (let y = 0; y < 540; y += 48) { c.beginPath(); c.moveTo(0, y); c.lineTo(960, y); c.stroke(); }
      // walls
      for (const [x, y, w2, h] of walls) {
        c.fillStyle = '#2c3e50'; c.fillRect(x, y, w2, h);
        c.fillStyle = '#3d5268'; c.fillRect(x, y, w2, 4);
      }
      // lasers (both players)
      const drawLaser = (p, col) => {
        const dx = Math.cos(p.a), dy = Math.sin(p.a);
        const t = castWall(p.x, p.y, dx, dy);
        c.strokeStyle = col; c.globalAlpha = 0.35; c.lineWidth = 1.5;
        c.beginPath(); c.moveTo(p.x, p.y); c.lineTo(p.x + dx * t, p.y + dy * t); c.stroke();
        c.globalAlpha = 1;
      };
      drawLaser(me, E.colors[E.me]);
      if (foeI) drawLaser(foeI, E.colors[1 - E.me]);
      // tracers
      for (const t of tracers) {
        c.strokeStyle = t.c; c.globalAlpha = Math.min(1, t.life * 6); c.lineWidth = 3;
        c.beginPath(); c.moveTo(t.x1, t.y1); c.lineTo(t.x2, t.y2); c.stroke(); c.globalAlpha = 1;
      }
      // players
      const drawP = (p, col, isMe) => {
        c.fillStyle = col;
        c.beginPath(); c.arc(p.x, p.y, R, 0, 7); c.fill();
        c.strokeStyle = '#0a0e14'; c.lineWidth = 2; c.stroke();
        // rifle
        c.strokeStyle = col === '#4dc3ff' ? '#bfe9ff' : '#ffd0d0'; c.lineWidth = 5;
        c.beginPath(); c.moveTo(p.x, p.y);
        c.lineTo(p.x + Math.cos(p.a) * 24, p.y + Math.sin(p.a) * 24); c.stroke();
        if (isMe && reload > 0) {
          c.fillStyle = 'rgba(0,0,0,0.6)'; c.fillRect(p.x - 18, p.y - 28, 36, 6);
          c.fillStyle = '#ffd166'; c.fillRect(p.x - 18, p.y - 28, 36 * (1 - reload / RELOAD), 6);
        }
      };
      if (foeI) drawP(foeI, E.colors[1 - E.me], false);
      drawP(me, E.colors[E.me], true);
      // hit flashes
      for (const f of flashes) {
        c.fillStyle = '#fff'; c.globalAlpha = f.life * 2;
        c.beginPath(); c.arc(f.x, f.y, 26 * (0.4 - f.life + 0.6), 0, 7); c.fill(); c.globalAlpha = 1;
      }
    },
  };
})());

regGame('golf', (() => {

  let aiming, aimVec, preShot, parts, interT, stopT, suddenDeath, matchDone;

  // 30 holes: w=walls, s=sand, wa=water, st=start, h=hole
  const MAPS = [

    { n: 'The Vault', w: [[740, 180, 24, 180], [740, 180, 170, 24], [740, 336, 170, 24]], s: [], wa: [], st: [110, 270], h: [830, 270] },
    { n: 'Twin Traps', w: [], s: [[330, 120, 140, 120], [490, 300, 140, 120]], wa: [], st: [110, 270], h: [850, 270] },
    { n: 'Long Shot', w: [], s: [[16, 16, 180, 120], [760, 404, 168, 120]], wa: [], st: [100, 480], h: [860, 70] },
    { n: 'Corner Pocket', w: [[700, 150, 26, 180]], s: [], wa: [], st: [110, 440], h: [870, 80] },
    { n: 'The Gate', w: [[470, 16, 26, 210], [470, 314, 26, 210]], s: [], wa: [], st: [110, 270], h: [850, 270] },
    { n: 'Double Gate', w: [[330, 16, 26, 300], [620, 224, 26, 300]], s: [], wa: [], st: [110, 270], h: [850, 270] },
    { n: 'The Moat', w: [], s: [], wa: [[700, 160, 180, 36], [700, 344, 180, 36], [700, 196, 36, 148]], st: [110, 270], h: [790, 270] },
    { n: 'Zigzag Alley', w: [[180, 130, 600, 26], [180, 380, 600, 26]], s: [], wa: [], st: [110, 60], h: [850, 480] },
    { n: 'The Comb', w: [[240, 16, 26, 300], [430, 224, 26, 300], [620, 16, 26, 300], [810, 224, 26, 300]], s: [], wa: [], st: [110, 440], h: [880, 100] },
    { n: 'The Steps', w: [[250, 380, 120, 120], [420, 280, 120, 120], [590, 180, 120, 120], [760, 80, 120, 120]], s: [], wa: [], st: [110, 460], h: [900, 60] },
    { n: 'The Beach', w: [], s: [[16, 300, 912, 224]], wa: [], st: [110, 460], h: [850, 460] },
    { n: 'Peninsula', w: [], s: [], wa: [[520, 120, 40, 404], [560, 120, 300, 40]], st: [110, 270], h: [790, 340] },
    { n: 'Chicane', w: [[350, 120, 80, 180], [540, 240, 80, 180]], s: [], wa: [], st: [110, 270], h: [850, 270] },
    { n: 'Two Rooms', w: [[470, 16, 26, 420]], s: [], wa: [], st: [110, 140], h: [850, 140] },
    { n: 'Sand Snake', w: [], s: [[200, 80, 120, 360], [320, 360, 320, 80], [640, 120, 120, 320]], wa: [], st: [110, 270], h: [850, 270] },
    { n: 'The Cross', w: [[440, 120, 80, 300], [330, 230, 300, 80]], s: [], wa: [], st: [110, 80], h: [850, 460] },
    { n: 'Minefield', w: [[260, 90, 26, 26], [380, 200, 26, 26], [300, 330, 26, 26], [500, 120, 26, 26], [520, 400, 26, 26], [660, 250, 26, 26], [740, 100, 26, 26], [700, 430, 26, 26]], s: [[420, 250, 90, 90]], wa: [], st: [110, 270], h: [860, 270] },
    { n: 'The Gauntlet', w: [[300, 16, 26, 200], [300, 324, 26, 200], [640, 150, 26, 240]], s: [[400, 200, 140, 140]], wa: [[760, 16, 60, 160], [760, 364, 60, 160]], st: [110, 270], h: [880, 270] },
  ];

  function allWalls() {
    return [[0, 0, 960, T], [0, 540 - T, 960, T], [0, 0, T, 540], [960 - T, 0, T, 540], ...map.w];
  }
  const inRect = (x, y, [rx, ry, rw, rh]) => x > rx && x < rx + rw && y > ry && y < ry + rh;
  const inSand = (x, y) => map.s.some((r) => inRect(x, y, r));
  const inWater = (x, y) => map.wa.some((r) => inRect(x, y, r));

  function myTurn() { return turn === E.me && phase === 'aim' && E.playing && !matchDone; }

  function setHudLine() {
    E.setHud(`⛳ Hole ${holeIdx + 1}/${suddenDeath ? '∞' : nHoles} · ${E.names[0]} <b style="color:${E.colors[0]}">${totals[0]}</b> — <b style="color:${E.colors[1]}">${totals[1]}</b> ${E.names[1]}`);
  }

  function startHole() {
    map = MAPS[order[holeIdx % order.length]];
    ball = { x: map.st[0], y: map.st[1], vx: 0, vy: 0 };
    foeBall = { x: map.st[0], y: map.st[1] };
    foe = makeInterp();
    strokes = [0, 0]; holed = [false, false];
    turn = holeIdx % 2; // alternate honors
    phase = 'aim'; aiming = false; aimVec = null;
    preShot = { x: ball.x, y: ball.y };
    stopT = 0; interT = 0;
    setHudLine();
  }

  function finishShot(sunk) {
    // called on MY client when my shot ends (ball stopped / sunk / picked up)
    if (sunk) holed[E.me] = true;
    if (!sunk && strokes[E.me] >= MAX_STROKES) { holed[E.me] = true; strokes[E.me] = MAX_STROKES; }
    phase = 'aim';
    E.gsend({ done: { x: Math.round(ball.x), y: Math.round(ball.y), h: holed[E.me] ? 1 : 0, s: strokes[E.me] } });
    advanceTurn();
  }

  function advanceTurn() {
    if (holed[0] && holed[1]) {
      totals[0] += strokes[0]; totals[1] += strokes[1];
      phase = 'inter'; interT = 3.0;
      setHudLine();
      return;
    }
    const other = 1 - turn;
    turn = holed[other] ? turn : other;
  }

  function nextHoleOrEnd() {
    const played = holeIdx + 1;
    if (suddenDeath) {
      if (strokes[0] !== strokes[1]) { endMatch(strokes[0] < strokes[1] ? 0 : 1); return; }
    } else if (played >= nHoles) {
      if (totals[0] !== totals[1]) { endMatch(totals[0] < totals[1] ? 0 : 1); return; }
      suddenDeath = true; // tied — sudden death holes
    }
    holeIdx++;
    startHole();
  }

  function endMatch(w) {
    matchDone = true;
    phase = 'end';
    E.matchWin(w);
  }

  return {
    name: 'Minigolf', ico: '⛳',
    desc: '30 holes, turn-based stroke play. Lowest total wins.',
    controls: 'On YOUR turn: drag from your ball & release to putt · water = +1 penalty · max 8 strokes',

    init(e) { E = e; },

    newRound() {
      nHoles = clamp((E.opts && E.opts.holes) || 9, 1, 30);
      // seeded shuffle of the 30 maps — same order on both clients
      order = MAPS.map((_, i) => i);
      for (let i = order.length - 1; i > 0; i--) {
        const j = Math.floor(E.rand() * (i + 1));
        [order[i], order[j]] = [order[j], order[i]];
      }
      holeIdx = 0; totals = [0, 0];
      suddenDeath = false; matchDone = false;
      parts = [];
      this._lastSent = 0;
      startHole();
    },

    update(dt) {
      if (phase === 'inter') {
        interT -= dt;
        if (interT <= 0) nextHoleOrEnd();
      }
      // my ball physics only while my shot is rolling
      if (phase === 'roll' && E.playing) {
        const sp = Math.hypot(ball.vx, ball.vy);
        if (sp > 0) {
          const decel = (inSand(ball.x, ball.y) ? 900 : 240) * dt;
          const ns = Math.max(0, sp - decel);
          if (ns < 12) { ball.vx = 0; ball.vy = 0; }
          else { ball.vx *= ns / sp; ball.vy *= ns / sp; }
          ball.x += ball.vx * dt; ball.y += ball.vy * dt;
          for (const [x, y, w, h] of allWalls()) {
            const c = circleRect(ball.x, ball.y, R, x, y, w, h);
            if (c) {
              ball.x = c.x; ball.y = c.y;
              const dot = ball.vx * c.nx + ball.vy * c.ny;
              if (dot < 0) {
                ball.vx = (ball.vx - 2 * dot * c.nx) * 0.85;
                ball.vy = (ball.vy - 2 * dot * c.ny) * 0.85;
                SFX.bounce();
              }
            }
          }
          // water hazard: +1 penalty, back to where you played from
          if (inWater(ball.x, ball.y)) {
            SFX.losePoint();
            for (let i = 0; i < 12; i++) parts.push({ x: ball.x, y: ball.y, vx: (Math.random() - 0.5) * 160, vy: -Math.random() * 180, life: 0.6, c: '#69b6e8' });
            strokes[E.me] = Math.min(MAX_STROKES, strokes[E.me] + 1);
            ball.x = preShot.x; ball.y = preShot.y; ball.vx = 0; ball.vy = 0;
            finishShot(false);
          }
        }
        // hole pull + sink
        const [hx, hy] = map.h;
        const d = Math.hypot(ball.x - hx, ball.y - hy);
        const spd = Math.hypot(ball.vx, ball.vy);
        if (d < 18 && spd < 320 && spd > 0) {
          ball.vx += ((hx - ball.x) / (d || 1)) * 500 * dt;
          ball.vy += ((hy - ball.y) / (d || 1)) * 500 * dt;
        }
        if (phase === 'roll' && d < 10 && spd < 300) {
          ball.vx = 0; ball.vy = 0; ball.x = hx; ball.y = hy;
          SFX.sink();
          for (let i = 0; i < 16; i++) parts.push({ x: hx, y: hy, vx: Math.cos(i / 16 * 6.28) * 90, vy: Math.sin(i / 16 * 6.28) * 90 - 60, life: 0.8, c: '#ffd166' });
          finishShot(true);
        } else if (phase === 'roll' && Math.hypot(ball.vx, ball.vy) === 0) {
          stopT += dt;
          if (stopT > 0.25) { stopT = 0; finishShot(false); }
        } else stopT = 0;
      }
      parts.forEach((p) => { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 200 * dt; p.life -= dt; });
      parts = parts.filter((p) => p.life > 0);
      this._lastSent += dt;
      if (this._lastSent > 1 / 25) {
        this._lastSent = 0;
        if (phase === 'roll') E.gsend({ b: [Math.round(ball.x), Math.round(ball.y)] });
      }
      const fi = foe.get(['x', 'y']);
      if (fi && turn !== E.me && !holed[1 - E.me]) { foeBall.x = fi.x; foeBall.y = fi.y; }
    },

    onDown(x, y) {
      if (myTurn()) { aiming = true; aimVec = { x, y }; }
    },
    onMove(x, y) { if (aiming) aimVec = { x, y }; },
    onUp(x, y) {
      if (!aiming) return;
      aiming = false;
      if (!myTurn()) return;
      let dx = ball.x - x, dy = ball.y - y;
      const len = Math.hypot(dx, dy);
      if (len < 14) return; // cancel
      const pow = Math.min(len, 240) / 240;
      preShot = { x: ball.x, y: ball.y };
      ball.vx = (dx / len) * pow * 640;
      ball.vy = (dy / len) * pow * 640;
      strokes[E.me]++;
      phase = 'roll'; stopT = 0;
      SFX.putt();
      E.gsend({ stroke: strokes[E.me] });
    },

    onNet(d) {
      if (d.b) { foe.push({ x: d.b[0], y: d.b[1] }); }
      if (d.stroke != null) { strokes[1 - E.me] = d.stroke; SFX.putt(); }
      if (d.done) {
        foeBall.x = d.done.x; foeBall.y = d.done.y;
        strokes[1 - E.me] = d.done.s;
        if (d.done.h) { holed[1 - E.me] = true; if (d.done.h) SFX.sink(); }
        foe.clear();
        advanceTurn();
      }
    },

    draw() {
      const c = E.ctx;
      c.fillStyle = '#1e4d2b'; c.fillRect(0, 0, 960, 540);
      for (let i = 0; i < 10; i++) { if (i % 2) { c.fillStyle = 'rgba(255,255,255,0.025)'; c.fillRect(i * 96, 0, 96, 540); } }
      for (const [sx, sy, sw, sh] of map.s) {
        c.fillStyle = '#c2a25c'; c.fillRect(sx, sy, sw, sh);
        c.fillStyle = 'rgba(0,0,0,0.08)';
        for (let i = 0; i < 5; i++) c.fillRect(sx + 8, sy + 8 + i * (sh / 5), sw - 16, 2);
      }
      for (const [wx, wy, ww, wh] of map.wa) {
        c.fillStyle = '#1b4965'; c.fillRect(wx, wy, ww, wh);
        c.fillStyle = 'rgba(255,255,255,0.12)';
        const ph = performance.now() / 700;
        for (let i = 0; i < Math.floor(wh / 22); i++) c.fillRect(wx + 4 + Math.sin(ph + i) * 3, wy + 8 + i * 22, ww - 14, 2.5);
      }
      for (const [x, y, w, h] of allWalls()) {
        c.fillStyle = '#6b4a2b'; c.fillRect(x, y, w, h);
        c.fillStyle = '#7d5a38'; c.fillRect(x, y, w, 4);
      }
      const [hx, hy] = map.h;
      c.fillStyle = '#0a0a0a'; c.beginPath(); c.arc(hx, hy, 11, 0, 7); c.fill();
      c.strokeStyle = '#ddd'; c.lineWidth = 3;
      c.beginPath(); c.moveTo(hx, hy - 2); c.lineTo(hx, hy - 42); c.stroke();
      c.fillStyle = '#e63946'; c.beginPath(); c.moveTo(hx, hy - 42); c.lineTo(hx + 22, hy - 34); c.lineTo(hx, hy - 26); c.fill();
      // opponent ball
      if (!holed[1 - E.me] || turn === 1 - E.me) {
        c.globalAlpha = 0.85;
        c.fillStyle = '#f5f5f5';
        c.beginPath(); c.arc(foeBall.x, foeBall.y, R, 0, 7); c.fill();
        c.strokeStyle = E.colors[1 - E.me]; c.lineWidth = 2.5; c.stroke();
        c.globalAlpha = 1;
      }
      // my ball
      if (!holed[E.me]) {
        c.fillStyle = '#fff';
        c.beginPath(); c.arc(ball.x, ball.y, R, 0, 7); c.fill();
        c.strokeStyle = E.colors[E.me]; c.lineWidth = 2.5; c.stroke();
        if (myTurn() && !aiming) { // pulse to show it's your go
          c.strokeStyle = E.colors[E.me]; c.globalAlpha = 0.4 + 0.3 * Math.sin(performance.now() / 250);
          c.lineWidth = 2; c.beginPath(); c.arc(ball.x, ball.y, R + 7, 0, 7); c.stroke(); c.globalAlpha = 1;
        }
      }
      // aim arrow
      if (aiming && aimVec && myTurn()) {
        let dx = ball.x - aimVec.x, dy = ball.y - aimVec.y;
        const len = Math.hypot(dx, dy);
        if (len > 14) {
          const p = Math.min(len, 240) / 240;
          const ex = ball.x + (dx / len) * p * 130, ey = ball.y + (dy / len) * p * 130;
          c.strokeStyle = `rgb(${Math.round(120 + p * 135)},${Math.round(220 - p * 160)},80)`;
          c.lineWidth = 4; c.setLineDash([8, 6]);
          c.beginPath(); c.moveTo(ball.x, ball.y); c.lineTo(ex, ey); c.stroke();
          c.setLineDash([]);
          const a = Math.atan2(ey - ball.y, ex - ball.x);
          c.beginPath(); c.moveTo(ex + Math.cos(a) * 10, ey + Math.sin(a) * 10);
          c.lineTo(ex + Math.cos(a + 2.6) * 9, ey + Math.sin(a + 2.6) * 9);
          c.lineTo(ex + Math.cos(a - 2.6) * 9, ey + Math.sin(a - 2.6) * 9);
          c.fillStyle = c.strokeStyle; c.fill();
        }
      }
      for (const p of parts) {
        c.fillStyle = p.c; c.globalAlpha = Math.min(1, p.life * 1.6); c.fillRect(p.x - 2.5, p.y - 2.5, 5, 5); c.globalAlpha = 1;
      }
      // hole info + turn banner
      c.font = 'bold 15px system-ui'; c.textAlign = 'left';
      c.fillStyle = 'rgba(255,255,255,0.85)';
      c.fillText(`${suddenDeath ? '☠ SUDDEN DEATH — ' : ''}Hole ${holeIdx + 1}: ${map.n}`, 30, 505);
      c.textAlign = 'right';
      c.fillStyle = E.colors[E.me];
      c.fillText(`You: ${strokes[E.me]}${holed[E.me] ? ' ⛳' : ''}`, 800, 505);
      c.fillStyle = E.colors[1 - E.me];
      c.fillText(`${E.names[1 - E.me]}: ${strokes[1 - E.me]}${holed[1 - E.me] ? ' ⛳' : ''}`, 930, 505);
      c.textAlign = 'center';
      if (E.playing && phase === 'aim' && !matchDone) {
        const mine = turn === E.me;
        c.fillStyle = mine ? E.colors[E.me] : 'rgba(255,255,255,0.55)';
        c.font = 'bold 19px system-ui';
        c.fillText(mine ? '▶ YOUR TURN — drag from your ball' : `${E.names[turn]} is putting…`, 480, 46);
      }
      // between-holes scorecard
      if (phase === 'inter' || phase === 'end') {
        c.fillStyle = 'rgba(10,14,20,0.88)';
        c.fillRect(160, 110, 640, 320);
        c.strokeStyle = '#2b3a4e'; c.lineWidth = 2; c.strokeRect(160, 110, 640, 320);
        c.fillStyle = '#ffd166'; c.font = 'bold 24px system-ui';
        c.fillText(`Hole ${holeIdx + 1} complete`, 480, 150);
        c.font = 'bold 19px system-ui';
        const w0 = strokes[0] < strokes[1], tie = strokes[0] === strokes[1];
        c.fillStyle = E.colors[0];
        c.fillText(`${E.names[0]}: ${strokes[0]} stroke${strokes[0] === 1 ? '' : 's'}${!tie && w0 ? '  🏅' : ''}`, 480, 195);
        c.fillStyle = E.colors[1];
        c.fillText(`${E.names[1]}: ${strokes[1]} stroke${strokes[1] === 1 ? '' : 's'}${!tie && !w0 ? '  🏅' : ''}`, 480, 228);
        c.fillStyle = '#fff'; c.font = 'bold 26px system-ui';
        c.fillText(`TOTAL   ${totals[0]} — ${totals[1]}`, 480, 285);
        c.fillStyle = 'rgba(255,255,255,0.6)'; c.font = '15px system-ui';
        const left = suddenDeath ? 'sudden death!' : `${nHoles - holeIdx - 1} hole${nHoles - holeIdx - 1 === 1 ? '' : 's'} to go`;
        c.fillText(phase === 'end' ? 'final scores' : `next hole in ${Math.ceil(interT)}… (${left})`, 480, 330);
        if (phase === 'end' || (holeIdx + 1 >= nHoles && !suddenDeath) ) {
          const lead = totals[0] === totals[1] ? null : (totals[0] < totals[1] ? 0 : 1);
          if (lead != null) {
            c.fillStyle = E.colors[lead]; c.font = 'bold 21px system-ui';
            c.fillText(`${E.names[lead]} wins the round of golf! 🏆`, 480, 375);
          }
        }
      }
      c.textAlign = 'left';
    },
  };
})());

<script>
// ---- TABLE TENNIS ----
// Latency-proof: BOTH sides simulate the ball. Your own paddle is authoritative
// on YOUR screen — if you touch it, you hit it. Paddle hits re-sync the ball
// state on both ends; misses are reported by the player who missed.
regGame('pong', (() => {
  let E, myY, foeY, foePad, ball, speed, trail, claimed;
  const PW = 13, PH = 104, BR = 7;
  const MYX = () => (E.me === 0 ? 42 : 960 - 42 - PW);
  const FOEX = () => (E.me === 0 ? 960 - 42 - PW : 42);

  return {
    name: 'Table Tennis', ico: '🏓',
    desc: 'Classic paddle duel. It only gets faster.',
    controls: 'Move mouse (or W/S) to steer your paddle',

    init(e) { E = e; },

    newRound() {
      myY = 270; foeY = 270;
      foePad = makeInterp();
      trail = [];
      speed = 380;
      claimed = false;
      // identical seeded serve on both sides
      const dir = (E.round % 2 === 0 ? 1 : -1);
      const ang = (E.rand() - 0.5) * 0.9;
      ball = { x: 480, y: 270, vx: Math.cos(ang) * 380 * dir, vy: Math.sin(ang) * 380 };
      this._lastSent = 0;
    },

    update(dt) {
      // my paddle
      const target = E.mouse.y;
      myY = lerp(myY, target, Math.min(1, dt * 18));
      if (E.keys.has('w')) myY -= 420 * dt;
      if (E.keys.has('s')) myY += 420 * dt;
      myY = clamp(myY, 20 + PH / 2, 520 - PH / 2);

      this._lastSent += dt;
      if (this._lastSent > 1 / 30) {
        this._lastSent = 0;
        E.gsend({ pp: Math.round(myY) });
      }

      if (E.playing) {
        const px = ball.x, py = ball.y;
        ball.x += ball.vx * dt; ball.y += ball.vy * dt;
        if (ball.y < 20 + BR && ball.vy < 0) { ball.y = 20 + BR; ball.vy *= -1; SFX.bounce(); }
        if (ball.y > 520 - BR && ball.vy > 0) { ball.y = 520 - BR; ball.vy *= -1; SFX.bounce(); }

        // swept collision against MY paddle only (local authority — no lag pass-through)
        const left = E.me === 0;
        const plane = left ? MYX() + PW + BR : MYX() - BR;
        const towardMe = left ? ball.vx < 0 : ball.vx > 0;
        if (towardMe) {
          const crossed = left ? (px >= plane && ball.x < plane) : (px <= plane && ball.x > plane);
          if (crossed) {
            const tc = (plane - px) / (ball.x - px);
            const yc = lerp(py, ball.y, clamp(tc, 0, 1));
            if (Math.abs(yc - myY) < PH / 2 + BR) {
              // hit!
              const off = clamp((yc - myY) / (PH / 2), -1, 1);
              speed = Math.min(900, speed * 1.055);
              const dir = left ? 1 : -1;
              const ang = off * 0.9;
              ball.x = plane; ball.y = yc;
              ball.vx = Math.cos(ang) * speed * dir;
              ball.vy = Math.sin(ang) * speed + off * 60;
              SFX.paddle();
              E.gsend({ hb: [Math.round(ball.x), Math.round(ball.y), Math.round(ball.vx), Math.round(ball.vy), Math.round(speed)] });
            }
          }
        }
        // I missed — point for the opponent (reported by the one it hurts: trustworthy)
        const pastMe = left ? ball.x < -30 : ball.x > 990;
        if (pastMe && !claimed) { claimed = true; E.claimPoint(1 - E.me); }
      }

      trail.push({ x: ball.x, y: ball.y, life: 0.3 });
      trail.forEach((t) => (t.life -= dt));
      trail = trail.filter((t) => t.life > 0);
      const fp = foePad.get(['y']);
      if (fp) foeY = fp.y;
    },

    onNet(d) {
      if (d.pp != null) foePad.push({ y: d.pp });
      if (d.hb) { // opponent hit — accept their state (their paddle, their authority)
        ball.x = d.hb[0]; ball.y = d.hb[1]; ball.vx = d.hb[2]; ball.vy = d.hb[3];
        speed = d.hb[4];
        SFX.paddle();
      }
    },

    draw() {
      const c = E.ctx;
      c.fillStyle = '#0e2a4a'; c.fillRect(0, 0, 960, 540);
      c.fillStyle = '#123a66'; c.fillRect(0, 0, 960, 20); c.fillRect(0, 520, 960, 20);
      c.strokeStyle = 'rgba(255,255,255,0.8)'; c.lineWidth = 3;
      c.strokeRect(14, 24, 932, 492);
      c.beginPath(); c.moveTo(14, 270); c.lineTo(946, 270); c.lineWidth = 1.5; c.strokeStyle = 'rgba(255,255,255,0.35)'; c.stroke();
      c.setLineDash([10, 8]); c.strokeStyle = 'rgba(255,255,255,0.5)'; c.lineWidth = 4;
      c.beginPath(); c.moveTo(480, 24); c.lineTo(480, 516); c.stroke(); c.setLineDash([]);
      for (const t of trail) {
        c.fillStyle = '#ffd166'; c.globalAlpha = t.life * 1.2;
        c.beginPath(); c.arc(t.x, t.y, BR * t.life * 3, 0, 7); c.fill();
      }
      c.globalAlpha = 1;
      c.fillStyle = '#fff'; c.beginPath(); c.arc(ball.x, ball.y, BR, 0, 7); c.fill();
      c.fillStyle = E.colors[E.me];
      c.beginPath(); c.roundRect(MYX(), myY - PH / 2, PW, PH, 6); c.fill();
      c.fillStyle = E.colors[1 - E.me];
      c.beginPath(); c.roundRect(FOEX(), foeY - PH / 2, PW, PH, 6); c.fill();
      // speed meter
      c.fillStyle = 'rgba(255,255,255,0.35)'; c.font = 'bold 13px system-ui'; c.textAlign = 'center';
      c.fillText(Math.round(speed) + ' px/s', 480, 508); c.textAlign = 'left';
    },
  };
})());

<script>
// ---- TANK DUEL: bouncing shells, last tank standing ----
regGame('tanks', (() => {
  let E, walls, me, foe, foeI, shells, cd, dead, parts, shellSeq, prot, shake, treads, flash;
  const SPEED = 175, TURN = 3.7, TR = 15, SR = 5, SHELL_SPEED = 360;

  function genWalls(rand) {
    const W = 960, H = 540, T = 16;
    const w = [[0, 0, W, T], [0, H - T, W, T], [0, 0, T, H], [W - T, 0, T, H]];
    for (let i = 0; i < 5; i++) {
      const bw = 40 + rand() * 80, bh = 40 + rand() * 80;
      const x = 130 + rand() * (W / 2 - 250), y = 40 + rand() * (H - 120 - bh);
      w.push([x, y, bw, bh]);
      w.push([W - x - bw, H - y - bh, bw, bh]); // 180° mirror for fairness
    }
    return w;
  }

  function boom(x, y, big) {
    SFX.boom();
    shake = Math.max(shake, big ? 0.45 : 0.18);
    for (let i = 0; i < (big ? 30 : 12); i++) {
      const a = Math.random() * 6.28, s = 40 + Math.random() * (big ? 240 : 130);
      parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.5 + Math.random() * 0.4, c: ['#ffd166', '#ff8c42', '#e63946'][i % 3] });
    }
  }

  function castWall(ox, oy, dx, dy) {
    let t = 2000;
    for (const [x, y, w2, h] of walls) t = Math.min(t, rayRect(ox, oy, dx, dy, x, y, w2, h));
    return t;
  }

  return {
    name: 'Tank Duel', ico: '🚜',
    desc: 'Shells bounce off walls. So can your mistakes.',
    controls: 'W/S or ↑/↓ drive · A/D or ←/→ turn · mouse aims · click fires (1 bounce!)',

    init(e) { E = e; },

    newRound() {
      walls = genWalls(E.rand);
      me = E.me === 0
        ? { x: 70, y: 70, h: 0.7, t: 0.7 }
        : { x: 890, y: 470, h: 0.7 + Math.PI, t: 0.7 + Math.PI };
      foe = makeInterp(); foeI = null;
      shells = []; parts = []; treads = [];
      cd = 0; dead = false; shellSeq = 0;
      prot = 1.0; shake = 0; flash = 0;
      this._foeDead = false;
      this._lastSent = 0;
      this._treadT = 0;
    },

    update(dt) {
      prot = Math.max(0, prot - dt);
      shake = Math.max(0, shake - dt * 1.6);
      flash = Math.max(0, flash - dt);
      if (E.playing && !dead) {
        if (E.keys.has('a') || E.keys.has('arrowleft')) me.h -= TURN * dt;
        if (E.keys.has('d') || E.keys.has('arrowright')) me.h += TURN * dt;
        let mv = 0;
        if (E.keys.has('w') || E.keys.has('arrowup')) mv = 1;
        if (E.keys.has('s') || E.keys.has('arrowdown')) mv = -0.65;
        if (mv) {
          me.x += Math.cos(me.h) * SPEED * mv * dt;
          me.y += Math.sin(me.h) * SPEED * mv * dt;
          for (const [x, y, w, h] of walls) {
            const c = circleRect(me.x, me.y, TR, x, y, w, h);
            if (c) { me.x = c.x; me.y = c.y; }
          }
          this._treadT += dt;
          if (this._treadT > 0.06) {
            this._treadT = 0;
            treads.push({ x: me.x, y: me.y, h: me.h, life: 2.2 });
            if (treads.length > 90) treads.shift();
          }
        }
        me.t = Math.atan2(E.mouse.y - me.y, E.mouse.x - me.x);
        cd = Math.max(0, cd - dt);
      }
      // shells (simulated on both sides)
      for (const s of shells) {
        s.x += s.vx * dt; s.y += s.vy * dt;
        s.hist.push({ x: s.x, y: s.y }); if (s.hist.length > 8) s.hist.shift();
        for (const [x, y, w, h] of walls) {
          const c = circleRect(s.x, s.y, SR, x, y, w, h);
          if (c) {
            s.bounces++;
            if (s.bounces > 1) { s.deadFx = true; boom(s.x, s.y, false); break; }
            s.x = c.x; s.y = c.y;
            const dot = s.vx * c.nx + s.vy * c.ny;
            s.vx -= 2 * dot * c.nx; s.vy -= 2 * dot * c.ny;
            SFX.bounce();
          }
        }
        s.life -= dt;
        // do I get hit? (each side detects hits on own tank; brief spawn protection)
        if (!dead && !s.deadFx && E.playing && prot <= 0) {
          const mine = s.owner === E.me;
          const armed = !mine || s.bounces > 0 || s.life < 2.5;
          if (armed && dist2(s.x, s.y, me.x, me.y) < (TR + SR) * (TR + SR)) {
            s.deadFx = true;
            dead = true;
            boom(me.x, me.y, true);
            E.gsend({ die: [Math.round(me.x), Math.round(me.y)] });
            E.claimPoint(1 - E.me);
          }
        }
      }
      shells = shells.filter((s) => !s.deadFx && s.life > 0);
      parts.forEach((p) => { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.98; p.vy *= 0.98; p.life -= dt; });
      parts = parts.filter((p) => p.life > 0);
      treads.forEach((t) => (t.life -= dt));
      treads = treads.filter((t) => t.life > 0);

      this._lastSent += dt;
      if (this._lastSent > 1 / 30 && !dead) {
        this._lastSent = 0;
        E.gsend({ tk: [Math.round(me.x), Math.round(me.y), +me.h.toFixed(2), +me.t.toFixed(2)] });
      }
      foeI = foe.get(['x', 'y'], ['h', 't']);
    },

    onDown() {
      if (!E.playing || dead || cd > 0 || prot > 0) return;
      if (shells.filter((s) => s.owner === E.me).length >= 3) return;
      cd = 0.45; flash = 0.08;
      const a = me.t;
      const sx = me.x + Math.cos(a) * (TR + 8), sy = me.y + Math.sin(a) * (TR + 8);
      shells.push({ id: E.me + ':' + (++shellSeq), owner: E.me, x: sx, y: sy, vx: Math.cos(a) * SHELL_SPEED, vy: Math.sin(a) * SHELL_SPEED, bounces: 0, life: 2.6, hist: [] });
      SFX.tank();
      shake = Math.max(shake, 0.08);
      E.gsend({ fire: [Math.round(sx), Math.round(sy), +a.toFixed(3)] });
    },

    onNet(d) {
      if (d.tk) foe.push({ x: d.tk[0], y: d.tk[1], h: d.tk[2], t: d.tk[3] });
      if (d.fire) {
        const [x, y, a] = d.fire;
        shells.push({ id: 'r' + Math.random(), owner: 1 - E.me, x, y, vx: Math.cos(a) * SHELL_SPEED, vy: Math.sin(a) * SHELL_SPEED, bounces: 0, life: 2.6, hist: [] });
        SFX.tank();
      }
      if (d.die) { boom(d.die[0], d.die[1], true); foeI = null; foe.clear(); this._foeDead = true; }
    },

    draw() {
      const c = E.ctx;
      c.save();
      if (shake > 0) c.translate((Math.random() - 0.5) * shake * 22, (Math.random() - 0.5) * shake * 22);
      c.fillStyle = '#22252a'; c.fillRect(-12, -12, 984, 564);
      c.strokeStyle = 'rgba(255,255,255,0.03)'; c.lineWidth = 1;
      for (let x = 0; x < 960; x += 60) { c.beginPath(); c.moveTo(x, 0); c.lineTo(x, 540); c.stroke(); }
      for (let y = 0; y < 540; y += 60) { c.beginPath(); c.moveTo(0, y); c.lineTo(960, y); c.stroke(); }
      // tread marks
      for (const t of treads) {
        c.save(); c.translate(t.x, t.y); c.rotate(t.h);
        c.fillStyle = `rgba(0,0,0,${0.14 * Math.min(1, t.life)})`;
        c.fillRect(-12, -14, 24, 5); c.fillRect(-12, 9, 24, 5);
        c.restore();
      }
      for (const [x, y, w, h] of walls) {
        c.fillStyle = '#4a4f57'; c.fillRect(x, y, w, h);
        c.fillStyle = '#5a616b'; c.fillRect(x, y, w, 4);
      }
      // aim preview with first bounce (mine only)
      if (!dead && E.playing) {
        let ox = me.x + Math.cos(me.t) * (TR + 8), oy = me.y + Math.sin(me.t) * (TR + 8);
        let dx = Math.cos(me.t), dy = Math.sin(me.t);
        let t1 = castWall(ox, oy, dx, dy);
        c.strokeStyle = E.colors[E.me]; c.globalAlpha = 0.30; c.setLineDash([4, 7]); c.lineWidth = 1.5;
        c.beginPath(); c.moveTo(ox, oy); c.lineTo(ox + dx * t1, oy + dy * t1); c.stroke();
        // reflected segment
        const hx = ox + dx * (t1 - 1), hy = oy + dy * (t1 - 1);
        let nx = 0, ny = 0, best = 1e9;
        for (const [x, y, w, h] of walls) {
          const cc = circleRect(ox + dx * (t1 + 0.5), oy + dy * (t1 + 0.5), 1.2, x, y, w, h);
          if (cc) { nx = cc.nx; ny = cc.ny; break; }
        }
        if (nx || ny) {
          const dot = dx * nx + dy * ny;
          const rx = dx - 2 * dot * nx, ry = dy - 2 * dot * ny;
          const t2 = Math.min(220, castWall(hx, hy, rx, ry));
          c.globalAlpha = 0.16;
          c.beginPath(); c.moveTo(hx, hy); c.lineTo(hx + rx * t2, hy + ry * t2); c.stroke();
        }
        c.setLineDash([]); c.globalAlpha = 1;
      }
      const drawTank = (t, col, isDead, shimmer) => {
        if (isDead) return;
        if (shimmer) { c.globalAlpha = 0.45 + 0.4 * Math.sin(performance.now() / 60); }
        c.save(); c.translate(t.x, t.y); c.rotate(t.h);
        c.fillStyle = '#333'; c.fillRect(-14, -16, 28, 7); c.fillRect(-14, 9, 28, 7);
        c.fillStyle = col; c.beginPath(); c.roundRect(-13, -11, 26, 22, 5); c.fill();
        c.restore();
        c.save(); c.translate(t.x, t.y); c.rotate(t.t);
        c.fillStyle = col; c.beginPath(); c.arc(0, 0, 8, 0, 7); c.fill();
        c.strokeStyle = col; c.lineWidth = 5; c.beginPath(); c.moveTo(0, 0); c.lineTo(24, 0); c.stroke();
        c.restore();
        c.globalAlpha = 1;
      };
      if (foeI && !this._foeDead) drawTank(foeI, E.colors[1 - E.me], false, false);
      drawTank(me, E.colors[E.me], dead, prot > 0);
      // muzzle flash
      if (flash > 0 && !dead) {
        const fx = me.x + Math.cos(me.t) * (TR + 12), fy = me.y + Math.sin(me.t) * (TR + 12);
        c.fillStyle = '#ffd166'; c.globalAlpha = flash / 0.08;
        c.beginPath(); c.arc(fx, fy, 9, 0, 7); c.fill(); c.globalAlpha = 1;
      }
      // shells + trails
      for (const s of shells) {
        for (let i = 0; i < s.hist.length; i++) {
          const p = s.hist[i];
          c.fillStyle = s.bounces > 0 ? '#ff8c42' : '#ccc';
          c.globalAlpha = (i / s.hist.length) * 0.3;
          c.beginPath(); c.arc(p.x, p.y, SR * (i / s.hist.length), 0, 7); c.fill();
        }
        c.globalAlpha = 1;
        c.fillStyle = s.bounces > 0 ? '#ff8c42' : '#eee';
        c.beginPath(); c.arc(s.x, s.y, SR, 0, 7); c.fill();
      }
      for (const p of parts) {
        c.fillStyle = p.c; c.globalAlpha = Math.min(1, p.life * 2);
        c.fillRect(p.x - 3, p.y - 3, 6, 6); c.globalAlpha = 1;
      }
      // ammo pips
      if (!dead) {
        const mine = 3 - shells.filter((s) => s.owner === E.me).length;
        for (let i = 0; i < 3; i++) {
          c.fillStyle = i < mine ? '#ffd166' : 'rgba(255,255,255,0.15)';
          c.beginPath(); c.arc(me.x - 12 + i * 12, me.y - 26, 3.2, 0, 7); c.fill();
        }
      }
      c.restore();
    },
  };
})());
