<script>
// ---- SUMO: shove your rival off a shrinking ice platform ----
// Physics model: each client owns its body. The opponent is DEAD-RECKONED
// (latest packet + velocity extrapolation) so collisions land where they look.
// Collisions = impulse (restitution) + sustained shove force, with a momentum
// advantage while dashing. Both clients run the mirrored computation.
regGame('sumo', (() => {
  let E, me, foe, foeR, radius, elapsed, fell, foeFell, dashCd, dashT, parts, hitGate;
  const R = 17, ACC = 850, FRICTION = 1.5;
  const CX = 480, CY = 270, R0 = 205, RMIN = 88;
  const PUNCH = 1.18, SHOVE = 3.4, DASH_V = 430, DASH_T = 0.28, DASH_CD = 1.2;

  return {
    name: 'Sumo', ico: '🥋',
    desc: 'Shrinking ice ring. Shove them off. Don\'t slip.',
    controls: 'WASD to skate · SPACE to dash (heavy hits!) · push your rival off the ice',

    init(e) { E = e; },

    newRound() {
      me = E.me === 0
        ? { x: CX - 120, y: CY, vx: 0, vy: 0 }
        : { x: CX + 120, y: CY, vx: 0, vy: 0 };
      foe = makeInterp();
      foeR = null;               // dead-reckoned render/collision position
      radius = R0; elapsed = 0;
      fell = false; foeFell = false;
      dashCd = 0; dashT = 0; hitGate = 0;
      parts = [];
      this._lastSent = 0;
    },

    dbg() { // test hook (?dev)
      return {
        x: me.x, y: me.y, vx: me.vx, vy: me.vy,
        fx: foeR ? foeR.x : null, fy: foeR ? foeR.y : null,
        d: foeR ? Math.hypot(me.x - foeR.x, me.y - foeR.y) : null,
        fell, foeFell, radius,
      };
    },

    update(dt) {
      if (E.playing) {
        elapsed += dt;
        if (elapsed > 5) radius = Math.max(RMIN, R0 - (elapsed - 5) * 9);
      }
      hitGate = Math.max(0, hitGate - dt);
      dashCd = Math.max(0, dashCd - dt);
      dashT = Math.max(0, dashT - dt);

      // ---- dead-reckon the opponent from their latest packet ----
      const pk = foe.latest();
      if (pk && !foeFell) {
        const age = clamp((performance.now() - pk._t) / 1000, 0, 0.22);
        foeR = { x: pk.x + pk.vx * age, y: pk.y + pk.vy * age, vx: pk.vx, vy: pk.vy, dash: pk.dash && age < 0.3 };
      } else if (foeFell) foeR = foeR; // keep last spot for the splash
      else foeR = null;

      if (E.playing && !fell) {
        let ax = 0, ay = 0;
        if (E.keys.has('w')) ay -= 1; if (E.keys.has('s')) ay += 1;
        if (E.keys.has('a')) ax -= 1; if (E.keys.has('d')) ax += 1;
        if (ax || ay) {
          const l = Math.hypot(ax, ay);
          me.vx += (ax / l) * ACC * dt; me.vy += (ay / l) * ACC * dt;
        }
        if (E.keys.has(' ') && dashCd === 0 && (ax || ay)) {
          const l = Math.hypot(ax, ay) || 1;
          me.vx += (ax / l) * DASH_V; me.vy += (ay / l) * DASH_V;
          dashCd = DASH_CD; dashT = DASH_T;
          SFX.go();
          for (let i = 0; i < 8; i++) parts.push({ x: me.x, y: me.y, vx: -(ax / l) * 80 + (Math.random() - 0.5) * 90, vy: -(ay / l) * 80 + (Math.random() - 0.5) * 90, life: 0.4, c: '#bfe9ff' });
        }
        // ice friction (grippy enough to hold your ground)
        me.vx *= Math.max(0, 1 - FRICTION * dt);
        me.vy *= Math.max(0, 1 - FRICTION * dt);
        const sp = Math.hypot(me.vx, me.vy);
        if (sp > 800) { me.vx *= 800 / sp; me.vy *= 800 / sp; }
        me.x += me.vx * dt; me.y += me.vy * dt;

        // ---- collision vs dead-reckoned opponent (mirrored on both clients) ----
        if (foeR && !foeFell) {
          const dx = me.x - foeR.x, dy = me.y - foeR.y;
          const d = Math.hypot(dx, dy);
          if (d < R * 2 && d > 0.001) {
            const nx = dx / d, ny = dy / d;
            // hard separation of my body (dead reckoning keeps both views close)
            const overlap = R * 2 - d;
            me.x += nx * overlap * 0.8;
            me.y += ny * overlap * 0.8;
            // impulse with restitution — applied while approaching
            const rvx = me.vx - foeR.vx, rvy = me.vy - foeR.vy;
            const vn = rvx * nx + rvy * ny;
            if (vn < 0) {
              // Bodies are meat, not rubber: base collisions are near-inelastic
              // (thud, stay engaged, grind). The DASH carries the bounce — a
              // dash hit on a non-dasher launches them.
              let share = 0.5, rest = 0.15;
              const meDash = dashT > 0, foeDash = !!foeR.dash;
              if (meDash && !foeDash) { share = 0.22; rest = 0.7; }
              else if (!meDash && foeDash) { share = 0.88; rest = 0.7; }
              else if (meDash && foeDash) { rest = 0.55; }
              const j = -(1 + rest) * vn * share * PUNCH;
              me.vx += nx * j; me.vy += ny * j;
              if (hitGate === 0) {
                hitGate = 0.18;
                SFX.paddle();
                if (-vn > 260) { SFX.hit(); }
                const px = (me.x + foeR.x) / 2, py = (me.y + foeR.y) / 2;
                const nP = clamp(Math.round(-vn / 40), 4, 14);
                for (let i = 0; i < nP; i++) parts.push({ x: px, y: py, vx: (Math.random() - 0.5) * (100 + -vn * 0.5), vy: (Math.random() - 0.5) * (100 + -vn * 0.5), life: 0.35, c: '#fff' });
              }
            }
            // sustained shove: their pressing speed bleeds into me every frame,
            // so a driving opponent bulldozes a passive one
            const press = foeR.vx * nx + foeR.vy * ny; // their speed along foe->me
            if (press > 0) {
              me.vx += nx * press * SHOVE * dt;
              me.vy += ny * press * SHOVE * dt;
            }
          }
        }

        // fell off?
        const dc = Math.hypot(me.x - CX, me.y - CY);
        if (dc > radius + R * 0.4) {
          fell = true;
          SFX.losePoint(); SFX.boom();
          E.gsend({ fell: [Math.round(me.x), Math.round(me.y)] });
          E.claimPoint(1 - E.me);
        }
      }
      parts.forEach((p) => { p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; });
      parts = parts.filter((p) => p.life > 0);

      this._lastSent += dt;
      if (this._lastSent > 1 / 45 && !fell) {   // 45 Hz — collisions want fresh data
        this._lastSent = 0;
        E.gsend({ su: [Math.round(me.x), Math.round(me.y), Math.round(me.vx), Math.round(me.vy), dashT > 0 ? 1 : 0] });
      }
    },

    onNet(d) {
      if (d.su) foe.push({ x: d.su[0], y: d.su[1], vx: d.su[2] || 0, vy: d.su[3] || 0, dash: !!d.su[4] });
      if (d.fell) { foeFell = true; if (foeR) { foeR.x = d.fell[0]; foeR.y = d.fell[1]; } SFX.boom(); }
    },

    draw() {
      const c = E.ctx;
      c.fillStyle = '#0b1b2b'; c.fillRect(0, 0, 960, 540);
      c.fillStyle = 'rgba(77,195,255,0.05)';
      for (let i = 0; i < 6; i++) c.fillRect(0, 90 * i + (Math.sin(performance.now() / 900 + i) * 6), 960, 3);
      const grd = c.createRadialGradient(CX, CY, radius * 0.2, CX, CY, radius);
      grd.addColorStop(0, '#dfeefb'); grd.addColorStop(1, '#a8c9e6');
      c.fillStyle = grd;
      c.beginPath(); c.arc(CX, CY, radius, 0, 7); c.fill();
      c.strokeStyle = radius <= RMIN + 1 ? '#e63946' : '#6fa3cc';
      c.lineWidth = 5; c.stroke();
      if (elapsed > 5 && radius > RMIN + 1) {
        c.strokeStyle = 'rgba(230,57,70,0.4)'; c.setLineDash([8, 10]); c.lineWidth = 2;
        c.beginPath(); c.arc(CX, CY, RMIN, 0, 7); c.stroke(); c.setLineDash([]);
      }
      c.strokeStyle = 'rgba(50,90,130,0.35)'; c.lineWidth = 3;
      c.beginPath(); c.arc(CX, CY, 34, 0, 7); c.stroke();
      const drawP = (p, col, down, dashing) => {
        if (down) return;
        c.fillStyle = 'rgba(0,0,0,0.25)';
        c.beginPath(); c.ellipse(p.x, p.y + R * 0.72, R * 0.95, R * 0.4, 0, 0, 7); c.fill();
        if (dashing) { // dash trail glow
          c.fillStyle = col; c.globalAlpha = 0.3;
          c.beginPath(); c.arc(p.x - (p.vx || 0) * 0.03, p.y - (p.vy || 0) * 0.03, R * 1.1, 0, 7); c.fill();
          c.globalAlpha = 1;
        }
        c.fillStyle = col;
        c.beginPath(); c.arc(p.x, p.y, R, 0, 7); c.fill();
        c.strokeStyle = '#0a0e14'; c.lineWidth = 2.5; c.stroke();
        c.strokeStyle = '#fff'; c.lineWidth = 4;
        c.beginPath(); c.arc(p.x, p.y, R - 4, -2.5, -0.6); c.stroke();
      };
      if (foeR) drawP(foeR, E.colors[1 - E.me], foeFell, foeR.dash);
      drawP(me, E.colors[E.me], fell, dashT > 0);
      for (const p of parts) {
        c.fillStyle = p.c; c.globalAlpha = Math.min(1, p.life * 2.2);
        c.fillRect(p.x - 2, p.y - 2, 4, 4); c.globalAlpha = 1;
      }
      if (!fell) {
        c.fillStyle = 'rgba(0,0,0,0.5)'; c.fillRect(me.x - 16, me.y - 30, 32, 5);
        c.fillStyle = dashCd === 0 ? '#3ddc84' : '#ffd166';
        c.fillRect(me.x - 16, me.y - 30, 32 * (1 - dashCd / DASH_CD), 5);
      }
      if (E.playing && elapsed < 5) {
        c.fillStyle = 'rgba(255,255,255,0.55)'; c.font = 'bold 15px system-ui'; c.textAlign = 'center';
        c.fillText(`ring shrinks in ${Math.ceil(5 - elapsed)}…`, CX, 46); c.textAlign = 'left';
      }
    },
  };
})());

</script>
<script>
// ---- BOMB ARENA: bomberman-style. WASD + SPACE. Crates, power-ups, up to 2 bots. ----
// Each client simulates all bombs/flames locally from placement events; you detect
// your own death (fair under latency). Host runs the bots. First human down loses the round.
regGame('bomb', (() => {
  let E, grid, powerups, bombs, flames, me, foe, foeI, bots, dead, foeDead, parts, cfgBots;
  let lives, foeLives, foeGhost, prot, respawnT, mySpawn;
  const COLS = 15, ROWS = 9, CS = 60, OX = 30, OY = 0, PR = 16;
  const BOT_COLS = ['#b98af7', '#8ee6a1'];
  const FUSE = 2.5, FLAME_T = 0.5, LIVES = 3;
  const PERKS = {
    bomb: ['💣', 'Extra Bomb', 'Carry one more bomb at a time'],
    fire: ['🔥', 'Bigger Blast', '+1 tile of explosion range'],
    speed: ['⚡', 'Speed Boost', 'Move faster'],
  };

  const cellAt = (px, py) => [clamp(Math.round((px - OX - CS / 2) / CS), 0, COLS - 1), clamp(Math.round((py - OY - CS / 2) / CS), 0, ROWS - 1)];
  const cellXY = (cx, cy) => [OX + cx * CS + CS / 2, OY + cy * CS + CS / 2];
  const isPillar = (cx, cy) => cx % 2 === 1 && cy % 2 === 1;
  const inGrid = (cx, cy) => cx >= 0 && cx < COLS && cy >= 0 && cy < ROWS;
  const key = (cx, cy) => cx + ',' + cy;

  function solidAt(cx, cy) {
    if (!inGrid(cx, cy)) return true;
    if (isPillar(cx, cy)) return true;
    if (grid[cy][cx] === 1) return true; // crate
    return false; // bombs are walkable!
  }

  function moveActor(a, vx, vy, dt, speed) {
    const step = (dx, dy) => {
      a.x += dx; a.y += dy;
      const solids = [];
      const [ccx, ccy] = cellAt(a.x, a.y);
      for (let cy = ccy - 1; cy <= ccy + 1; cy++) for (let cx = ccx - 1; cx <= ccx + 1; cx++) {
        if (solidAt(cx, cy)) solids.push([OX + cx * CS, OY + cy * CS]);
      }
      for (const [rx, ry] of solids) {
        const c = circleRect(a.x, a.y, PR, rx, ry, CS, CS);
        if (c) { a.x = c.x; a.y = c.y; }
      }
      a.x = clamp(a.x, OX + PR, OX + COLS * CS - PR);
      a.y = clamp(a.y, OY + PR, OY + ROWS * CS - PR);
    };
    if (vx || vy) {
      const l = Math.hypot(vx, vy);
      step((vx / l) * speed * dt, 0);
      step(0, (vy / l) * speed * dt);
    }
  }

  function placeBomb(owner, cx, cy, r) {
    if (bombs.some((b) => b.cx === cx && b.cy === cy)) return null;
    const b = { cx, cy, r, fuse: FUSE, owner };
    bombs.push(b);
    SFX.putt();
    return b;
  }

  function explode(b) {
    SFX.boom();
    const cells = [[b.cx, b.cy]];
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      for (let i = 1; i <= b.r; i++) {
        const cx = b.cx + dx * i, cy = b.cy + dy * i;
        if (!inGrid(cx, cy) || isPillar(cx, cy)) break;
        cells.push([cx, cy]);
        const ob = bombs.find((o) => o.cx === cx && o.cy === cy);
        if (ob && ob.fuse > 0.08) ob.fuse = 0.08; // chain
        if (grid[cy][cx] === 1) { // crate: destroy, reveal loot, stop ray
          grid[cy][cx] = 0;
          const pu = powerups.hidden[key(cx, cy)];
          if (pu) powerups.live[key(cx, cy)] = pu;
          for (let p = 0; p < 5; p++) parts.push({ x: cellXY(cx, cy)[0], y: cellXY(cx, cy)[1], vx: (Math.random() - 0.5) * 200, vy: (Math.random() - 0.5) * 200 - 60, life: 0.5, c: '#c9944a' });
          break;
        }
      }
    }
    for (const [cx, cy] of cells) flames[key(cx, cy)] = FLAME_T;
  }

  function inFlames(x, y) {
    const [cx, cy] = cellAt(x, y);
    for (const [dcx, dcy] of [[0, 0], [1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const k = key(cx + dcx, cy + dcy);
      if (flames[k]) {
        const [fx, fy] = cellXY(cx + dcx, cy + dcy);
        if (circleRect(x, y, PR - 5, fx - CS / 2 + 6, fy - CS / 2 + 6, CS - 12, CS - 12)) return true;
      }
    }
    return false;
  }

  // --- bot brain (host only) ---
  function dangerMap() {
    const d = {};
    for (const k in flames) d[k] = true;
    for (const b of bombs) {
      d[key(b.cx, b.cy)] = true;
      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        for (let i = 1; i <= b.r; i++) {
          const cx = b.cx + dx * i, cy = b.cy + dy * i;
          if (!inGrid(cx, cy) || isPillar(cx, cy)) break;
          d[key(cx, cy)] = true;
          if (grid[cy][cx] === 1) break;
        }
      }
    }
    return d;
  }
  function bfs(scx, scy, goalFn, danger, allowDanger) {
    const q = [[scx, scy]], prev = {}, seen = { [key(scx, scy)]: true };
    while (q.length) {
      const [cx, cy] = q.shift();
      if (goalFn(cx, cy)) {
        const path = [];
        let k = key(cx, cy);
        let cur = [cx, cy];
        while (cur) { path.unshift(cur); cur = prev[key(cur[0], cur[1])]; }
        return path;
      }
      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const nx = cx + dx, ny = cy + dy, k = key(nx, ny);
        if (!inGrid(nx, ny) || seen[k] || isPillar(nx, ny) || grid[ny][nx] === 1) continue;
        if (!allowDanger && danger[k]) continue;
        seen[k] = true; prev[k] = [cx, cy]; q.push([nx, ny]);
      }
    }
    return null;
  }
  function botThink(bot, dt) {
    bot.think -= dt;
    if (bot.think > 0) return;
    bot.think = 0.12;
    const [cx, cy] = cellAt(bot.x, bot.y);
    const danger = dangerMap();
    let path = null;
    if (danger[key(cx, cy)]) {
      path = bfs(cx, cy, (x, y) => !danger[key(x, y)], danger, true); // flee
    } else {
      // bomb if next to a crate or close to a human
      const nearCrate = [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([dx, dy]) => inGrid(cx + dx, cy + dy) && grid[cy + dy][cx + dx] === 1);
      const humans = [me, foeI].filter(Boolean).filter((h) => !(h === me && dead) && !(h === foeI && foeDead));
      const nearHuman = humans.some((h) => { const [hx, hy] = cellAt(h.x, h.y); return Math.abs(hx - cx) + Math.abs(hy - cy) <= 2; });
      if (bot.bombs > 0 && (nearCrate || nearHuman) && Math.random() < 0.6) {
        const nb = placeBomb('bot' + bot.i, cx, cy, 2);
        if (nb) {
          bot.bombs--; nb.onDone = () => bot.bombs++;
          E.gsend({ bb: [bot.i, cx, cy, 2] });
          const d2m = dangerMap();
          path = bfs(cx, cy, (x, y) => !d2m[key(x, y)], d2m, true);
        }
      }
      if (!path) {
        const targets = (x, y) => [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([dx, dy]) => inGrid(x + dx, y + dy) && grid[y + dy][x + dx] === 1)
          || (powerups.live[key(x, y)] != null);
        path = bfs(cx, cy, targets, danger, false);
      }
    }
    bot.path = path && path.length > 1 ? path.slice(1) : null;
  }
  function botMove(bot, dt) {
    botThink(bot, dt);
    if (!bot.path || !bot.path.length) return;
    const [tx, ty] = cellXY(bot.path[0][0], bot.path[0][1]);
    const dx = tx - bot.x, dy = ty - bot.y;
    if (Math.hypot(dx, dy) < 6) { bot.path.shift(); return; }
    moveActor(bot, dx, dy, dt, 118);
  }

  return {
    name: 'Bomb Arena', ico: '💣',
    desc: '3 lives, crates, power-ups. Add bots in the lobby!',
    controls: 'WASD move · SPACE drops a bomb (you can walk over them) · 💣 +1 bomb · 🔥 +1 range · ⚡ speed · 3 ♥ each',

    init(e) { E = e; },

    newRound() {
      cfgBots = (E.opts && E.opts.bots) || 0;
      grid = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
      powerups = { hidden: {}, live: {} };
      const spawns = [[0, 0], [COLS - 1, ROWS - 1], [COLS - 1, 0], [0, ROWS - 1]];
      for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
        if (isPillar(x, y)) continue;
        if (spawns.some(([sx, sy]) => Math.abs(sx - x) + Math.abs(sy - y) <= 2)) continue;
        if (E.rand() < 0.62) {
          grid[y][x] = 1;
          const r = E.rand();
          if (r < 0.13) powerups.hidden[key(x, y)] = 'bomb';
          else if (r < 0.26) powerups.hidden[key(x, y)] = 'fire';
          else if (r < 0.39) powerups.hidden[key(x, y)] = 'speed';
        }
      }
      const myS = spawns[E.me];
      mySpawn = cellXY(...myS);
      me = { x: mySpawn[0], y: mySpawn[1], speed: 150, maxBombs: 1, bombs: 1, radius: 2 };
      foe = makeInterp(); foeI = null;
      bots = [];
      for (let i = 0; i < cfgBots; i++) {
        const s = spawns[2 + i];
        bots.push({ i, x: cellXY(...s)[0], y: cellXY(...s)[1], alive: true, bombs: 1, think: 0.5 + i * 0.3, path: null });
      }
      bombs = []; flames = {}; parts = [];
      dead = false; foeDead = false;
      lives = LIVES; foeLives = LIVES; foeGhost = false;
      prot = 1.5; respawnT = 0;
      this._lastSent = 0;
      this._hudLives();
    },

    _hudLives() {
      const h = (n, col) => `<span style="color:${col};letter-spacing:2px">${'♥'.repeat(Math.max(0, n))}<span style="opacity:.25">${'♥'.repeat(Math.max(0, LIVES - n))}</span></span>`;
      E.setHud(`<span style="color:${E.colors[0]}">${E.names[0]}</span> ${h(E.me === 0 ? lives : foeLives, E.colors[0])} &nbsp;💣&nbsp; ${h(E.me === 1 ? lives : foeLives, E.colors[1])} <span style="color:${E.colors[1]}">${E.names[1]}</span>`);
    },

    update(dt) {
      // bombs & flames (simulated locally on both sides)
      for (const b of bombs) {
        b.fuse -= dt;
        if (b.fuse <= 0) { explode(b); if (b.onDone) b.onDone(); b.dead = true; }
      }
      bombs = bombs.filter((b) => !b.dead);
      for (const k in flames) { flames[k] -= dt; if (flames[k] <= 0) delete flames[k]; }
      parts.forEach((p) => { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 300 * dt; p.life -= dt; });
      parts = parts.filter((p) => p.life > 0);

      prot = Math.max(0, prot - dt);
      // respawn countdown
      if (dead && lives > 0 && E.playing) {
        respawnT -= dt;
        if (respawnT <= 0) {
          dead = false;
          me.x = mySpawn[0]; me.y = mySpawn[1];
          prot = 2.5; // shimmering grace period
          SFX.go();
        }
      }
      if (E.playing && !dead) {
        let vx = 0, vy = 0;
        if (E.keys.has('w')) vy -= 1; if (E.keys.has('s')) vy += 1;
        if (E.keys.has('a')) vx -= 1; if (E.keys.has('d')) vx += 1;
        moveActor(me, vx, vy, dt, me.speed);
        // pickups
        const [cx, cy] = cellAt(me.x, me.y);
        const pu = powerups.live[key(cx, cy)];
        if (pu) {
          delete powerups.live[key(cx, cy)];
          if (pu === 'bomb') { me.maxBombs = Math.min(4, me.maxBombs + 1); me.bombs++; }
          if (pu === 'fire') me.radius = Math.min(6, me.radius + 1);
          if (pu === 'speed') me.speed = Math.min(240, me.speed + 24);
          SFX.point();
          E.gsend({ pu: [cx, cy] });
        }
        // hit check (own screen decides — fair under lag). 3 lives per game.
        if (prot <= 0 && inFlames(me.x, me.y)) {
          lives--;
          this._hudLives();
          SFX.hit(); SFX.boom();
          for (let i = 0; i < 20; i++) parts.push({ x: me.x, y: me.y, vx: (Math.random() - 0.5) * 300, vy: (Math.random() - 0.5) * 300, life: 0.7, c: E.colors[E.me] });
          dead = true;
          E.gsend({ die: lives });
          if (lives <= 0) E.matchWin(1 - E.me);
          else respawnT = 1.3;
        }
      }

      // host runs bots
      if (E.isHost && E.playing) {
        for (const bot of bots) {
          if (!bot.alive) continue;
          botMove(bot, dt);
          if (inFlames(bot.x, bot.y)) {
            bot.alive = false;
            SFX.boom();
            for (let i = 0; i < 14; i++) parts.push({ x: bot.x, y: bot.y, vx: (Math.random() - 0.5) * 260, vy: (Math.random() - 0.5) * 260, life: 0.6, c: BOT_COLS[bot.i] });
            E.gsend({ bd: bot.i });
          }
        }
      }

      this._lastSent += dt;
      if (this._lastSent > 1 / 30) {
        this._lastSent = 0;
        if (!dead) E.gsend({ bp: [Math.round(me.x), Math.round(me.y)] });
        if (E.isHost) for (const bot of bots) if (bot.alive) E.gsend({ bt: [bot.i, Math.round(bot.x), Math.round(bot.y)] });
      }
      foeI = foe.get(['x', 'y']);
    },

    onKey(k) {
      if (k !== ' ' || !E.playing || dead || me.bombs <= 0) return;
      const [cx, cy] = cellAt(me.x, me.y);
      const b = placeBomb(E.me, cx, cy, me.radius);
      if (b) {
        me.bombs--; b.onDone = () => me.bombs++;
        E.gsend({ bomb: [cx, cy, me.radius] });
      }
    },

    onNet(d) {
      if (d.bp) { foe.push({ x: d.bp[0], y: d.bp[1] }); foeGhost = false; }
      if (d.bomb) placeBomb(1 - E.me, d.bomb[0], d.bomb[1], d.bomb[2]);
      if (d.pu) delete powerups.live[key(d.pu[0], d.pu[1])];
      if (d.die != null) {
        foeLives = d.die;
        this._hudLives();
        SFX.boom();
        if (foeLives <= 0) foeDead = true;
        else foeGhost = true; // hidden until they respawn and stream again
      }
      if (d.bt) { const bot = bots[d.bt[0]]; if (bot) { bot.x = d.bt[1]; bot.y = d.bt[2]; } }
      if (d.bb) placeBomb('bot' + d.bb[0], d.bb[1], d.bb[2], d.bb[3]);
      if (d.bd != null && bots[d.bd]) { bots[d.bd].alive = false; SFX.boom(); }
    },

    draw() {
      const c = E.ctx;
      c.fillStyle = '#254d2e'; c.fillRect(0, 0, 960, 540);
      for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
        const px = OX + x * CS, py = OY + y * CS;
        c.fillStyle = (x + y) % 2 ? '#2c5a36' : '#2a5432';
        c.fillRect(px, py, CS, CS);
        if (isPillar(x, y)) {
          c.fillStyle = '#5a616b'; c.fillRect(px + 2, py + 2, CS - 4, CS - 4);
          c.fillStyle = '#6b7480'; c.fillRect(px + 2, py + 2, CS - 4, 8);
        } else if (grid[y][x] === 1) {
          c.fillStyle = '#a5732f'; c.fillRect(px + 4, py + 4, CS - 8, CS - 8);
          c.strokeStyle = '#7d5620'; c.lineWidth = 2;
          c.strokeRect(px + 4, py + 4, CS - 8, CS - 8);
          c.beginPath(); c.moveTo(px + 4, py + CS / 2); c.lineTo(px + CS - 4, py + CS / 2);
          c.moveTo(px + CS / 2, py + 4); c.lineTo(px + CS / 2, py + CS - 4); c.stroke();
        }
      }
      // side gutters
      c.fillStyle = '#17351d'; c.fillRect(0, 0, OX, 540); c.fillRect(960 - OX, 0, OX, 540);
      // powerups
      for (const k in powerups.live) {
        const [cx, cy] = k.split(',').map(Number);
        const [px, py] = cellXY(cx, cy);
        c.fillStyle = '#0a0e14'; c.beginPath(); c.arc(px, py, 16, 0, 7); c.fill();
        const t = powerups.live[k];
        c.strokeStyle = t === 'bomb' ? '#4dc3ff' : t === 'fire' ? '#ff8c42' : '#3ddc84';
        c.lineWidth = 3; c.stroke();
        c.font = '16px system-ui'; c.textAlign = 'center'; c.textBaseline = 'middle';
        c.fillText(t === 'bomb' ? '💣' : t === 'fire' ? '🔥' : '⚡', px, py + 1);
        c.textBaseline = 'alphabetic'; c.textAlign = 'left';
      }
      // bombs
      for (const b of bombs) {
        const [px, py] = cellXY(b.cx, b.cy);
        const pulse = 1 + Math.sin((FUSE - b.fuse) * (6 + (FUSE - b.fuse) * 6)) * 0.08;
        c.fillStyle = '#14181f';
        c.beginPath(); c.arc(px, py + 2, 17 * pulse, 0, 7); c.fill();
        c.strokeStyle = '#2e3947'; c.lineWidth = 2; c.stroke();
        c.strokeStyle = '#c9944a'; c.lineWidth = 3;
        c.beginPath(); c.moveTo(px + 6, py - 12); c.quadraticCurveTo(px + 14, py - 22, px + 8, py - 26); c.stroke();
        if (Math.floor(b.fuse * 10) % 2 === 0) { c.fillStyle = '#ffd166'; c.beginPath(); c.arc(px + 8, py - 26, 3.5, 0, 7); c.fill(); }
      }
      // flames
      for (const k in flames) {
        const [cx, cy] = k.split(',').map(Number);
        const px = OX + cx * CS, py = OY + cy * CS;
        const a = clamp(flames[k] / FLAME_T, 0, 1);
        c.fillStyle = `rgba(255,140,66,${0.85 * a})`;
        c.fillRect(px + 4, py + 4, CS - 8, CS - 8);
        c.fillStyle = `rgba(255,209,102,${0.9 * a})`;
        c.fillRect(px + 14, py + 14, CS - 28, CS - 28);
      }
      // players & bots
      const drawGuy = (x, y, col, isDead) => {
        if (isDead) return;
        c.fillStyle = 'rgba(0,0,0,0.3)'; c.beginPath(); c.ellipse(x, y + 12, 13, 6, 0, 0, 7); c.fill();
        c.fillStyle = col; c.beginPath(); c.arc(x, y, PR - 1, 0, 7); c.fill();
        c.strokeStyle = '#0a0e14'; c.lineWidth = 2; c.stroke();
        c.fillStyle = '#fff'; c.beginPath(); c.arc(x - 5, y - 3, 3.4, 0, 7); c.arc(x + 5, y - 3, 3.4, 0, 7); c.fill();
        c.fillStyle = '#111'; c.beginPath(); c.arc(x - 4.6, y - 3, 1.7, 0, 7); c.arc(x + 5.4, y - 3, 1.7, 0, 7); c.fill();
      };
      for (const bot of bots) drawGuy(bot.x, bot.y, BOT_COLS[bot.i], !bot.alive);
      if (foeI) drawGuy(foeI.x, foeI.y, E.colors[1 - E.me], foeDead || foeGhost);
      if (prot > 0 && !dead) c.globalAlpha = 0.45 + 0.4 * Math.sin(performance.now() / 60);
      drawGuy(me.x, me.y, E.colors[E.me], dead);
      c.globalAlpha = 1;
      for (const p of parts) {
        c.fillStyle = p.c; c.globalAlpha = Math.min(1, p.life * 2);
        c.fillRect(p.x - 3, p.y - 3, 6, 6); c.globalAlpha = 1;
      }
      // my loadout
      c.font = 'bold 14px system-ui'; c.textAlign = 'center';
      c.fillStyle = 'rgba(0,0,0,0.45)'; c.fillRect(400, 2, 160, 20);
      c.fillStyle = 'rgba(255,255,255,0.9)';
      c.fillText(`💣${me.maxBombs}  🔥${me.radius}  ⚡${(me.speed / 150).toFixed(1)}x`, 480, 17);
      // respawn message
      if (dead && lives > 0) {
        c.fillStyle = '#ffd166'; c.font = 'bold 26px system-ui';
        c.fillText(`💔 respawning… ${'♥'.repeat(lives)} left`, 480, 250);
      }
      // perk legend during the countdown
      if (E.state === 'countdown') {
        const lx = 240, ly = 380, lw = 480, lh = 132;
        c.fillStyle = 'rgba(10,14,20,0.88)'; c.fillRect(lx, ly, lw, lh);
        c.strokeStyle = '#2b3a4e'; c.lineWidth = 2; c.strokeRect(lx, ly, lw, lh);
        c.font = 'bold 15px system-ui'; c.fillStyle = '#ffd166';
        c.fillText('POWER-UPS (hidden in crates)', 480, ly + 24);
        c.font = '14px system-ui'; c.textAlign = 'left';
        let yy = ly + 48;
        for (const k of ['bomb', 'fire', 'speed']) {
          const [ico, nm, ds] = PERKS[k];
          c.fillStyle = '#fff'; c.fillText(`${ico} ${nm}`, lx + 24, yy);
          c.fillStyle = 'rgba(255,255,255,0.6)'; c.fillText('— ' + ds, lx + 160, yy);
          yy += 22;
        }
        c.fillStyle = '#ff6b6b'; c.textAlign = 'center';
        c.fillText('♥♥♥ 3 lives — lose them all and your rival takes the game', 480, ly + 118);
      }
      // hover tooltip on ground perks
      const [mcx, mcy] = cellAt(E.mouse.x, E.mouse.y);
      const hoverPu = inGrid(mcx, mcy) && powerups.live[key(mcx, mcy)];
      if (hoverPu) {
        const [ico, nm, ds] = PERKS[hoverPu];
        const tx = clamp(E.mouse.x + 14, 16, 700), ty = clamp(E.mouse.y - 40, 16, 480);
        c.font = 'bold 13px system-ui'; c.textAlign = 'left';
        const wpx = Math.max(c.measureText(`${ico} ${nm}`).width, c.measureText(ds).width) + 20;
        c.fillStyle = 'rgba(10,14,20,0.92)'; c.fillRect(tx, ty, wpx, 42);
        c.strokeStyle = '#ffd166'; c.lineWidth = 1; c.strokeRect(tx, ty, wpx, 42);
        c.fillStyle = '#ffd166'; c.fillText(`${ico} ${nm}`, tx + 10, ty + 17);
        c.fillStyle = 'rgba(255,255,255,0.8)'; c.font = '12px system-ui';
        c.fillText(ds, tx + 10, ty + 33);
      }
      c.textAlign = 'left';
    },
  };
})());

</script>
<script>
// ---- QUICK DRAW: pure reaction western standoff ----
// Reaction time is measured locally on each machine, so ping does NOT matter — perfectly fair.
regGame('quickdraw', (() => {
  let E, phase, signalAt, t0, myMs, foeMs, resultMsg, decided, reports, elapsed;

  return {
    name: 'Quick Draw', ico: '🤠',
    desc: 'Wait for the signal. First trigger wins. Ping-proof.',
    controls: 'Wait for DRAW! … then click or press SPACE — too early and you lose the point',

    init(e) { E = e; },

    newRound() {
      phase = 'idle'; // idle (pre-countdown) -> wait -> go -> done
      signalAt = 1.2 + E.rand() * 4.3; // seconds after GO — same on both sides via seed
      t0 = null; myMs = null; foeMs = null; resultMsg = null;
      decided = false; reports = [null, null];
      elapsed = 0;
    },

    update(dt) {
      if (!E.playing) return;
      if (phase === 'idle') phase = 'wait';
      if (phase === 'wait' || phase === 'go') elapsed += dt;
      if (phase === 'wait' && elapsed >= signalAt) {
        phase = 'go'; t0 = performance.now();
        SFX.draw();
      }
      // host adjudication: if one player reported and other is silent 2.5s after signal -> silent player loses
      if (E.isHost && !decided && phase === 'go' && elapsed > signalAt + 2.5) {
        if (reports[0] != null && reports[1] == null) this._decide(0);
        else if (reports[1] != null && reports[0] == null) this._decide(1);
      }
    },

    _report(idx, ms) {
      if (decided) return;
      reports[idx] = ms;
      if (reports[0] != null && reports[1] != null) {
        this._decide(reports[0] === reports[1] ? (E.rand() < 0.5 ? 0 : 1) : (reports[0] < reports[1] ? 0 : 1));
      } else {
        // wait briefly for the other side's report (covers latency), then decide
        setTimeout(() => {
          if (!decided && reports[idx] != null) {
            const other = reports[1 - idx];
            if (other == null) this._decide(idx);
            else this._decide(reports[0] < reports[1] ? 0 : 1);
          }
        }, 900);
      }
    },
    _decide(winner) {
      if (decided) return;
      decided = true;
      E.gsend({ result: { ms: reports, w: winner } });
      this._showResult(reports, winner);
      E.claimPoint(winner);
    },
    _showResult(ms, w) {
      myMs = ms[E.me]; foeMs = ms[1 - E.me];
      phase = 'done';
    },

    _fire() {
      if (!E.playing || decided || phase === 'done') return;
      if (phase === 'wait') {
        // false start! opponent gets the point
        SFX.losePoint();
        resultMsg = 'FALSE START!';
        if (E.isHost) { reports[E.me] = 99999; this._decide(1 - E.me); }
        else E.gsend({ falseStart: E.me });
        phase = 'done';
        return;
      }
      if (phase === 'go' && myMs == null) {
        const ms = Math.round(performance.now() - t0);
        myMs = ms;
        SFX.shoot();
        if (E.isHost) this._report(0, ms);
        else E.gsend({ react: ms });
      }
    },

    onDown() { this._fire(); },
    onKey(k) { if (k === ' ') this._fire(); },

    onNet(d) {
      if (E.isHost) {
        if (d.react != null) this._report(1, d.react);
        if (d.falseStart != null && !decided) { reports[1] = 99999; this._decide(0); }
      }
      if (d.result) this._showResult(d.result.ms, d.result.w);
    },

    draw() {
      const c = E.ctx;
      const isGo = phase === 'go' || phase === 'done';
      // sky
      const g = c.createLinearGradient(0, 0, 0, 540);
      g.addColorStop(0, phase === 'go' ? '#1c4a2e' : '#402030');
      g.addColorStop(1, '#17141f');
      c.fillStyle = g; c.fillRect(0, 0, 960, 540);
      // sun/moon
      c.fillStyle = 'rgba(255,220,150,0.25)'; c.beginPath(); c.arc(480, 130, 55, 0, 7); c.fill();
      // ground
      c.fillStyle = '#2a2230'; c.fillRect(0, 430, 960, 110);
      // cacti
      c.fillStyle = '#274e2e';
      [[150, 395], [820, 405]].forEach(([x, y]) => {
        c.fillRect(x, y, 12, 46); c.fillRect(x - 12, y + 10, 12, 8); c.fillRect(x - 12, y - 4, 8, 20);
        c.fillRect(x + 12, y + 16, 12, 8); c.fillRect(x + 16, y + 2, 8, 20);
      });
      // duelists
      const drawCowboy = (x, col, flip, drawn) => {
        c.save(); c.translate(x, 430); c.scale(flip, 1);
        c.strokeStyle = col; c.fillStyle = col; c.lineWidth = 6; c.lineCap = 'round';
        c.beginPath(); c.arc(0, -95, 14, 0, 7); c.fill();                 // head
        c.fillRect(-20, -116, 40, 6); c.fillRect(-10, -128, 20, 12);      // hat
        c.beginPath(); c.moveTo(0, -80); c.lineTo(0, -30); c.stroke();    // body
        c.beginPath(); c.moveTo(0, -30); c.lineTo(-12, 0); c.moveTo(0, -30); c.lineTo(12, 0); c.stroke(); // legs
        if (drawn) { c.beginPath(); c.moveTo(0, -70); c.lineTo(26, -78); c.stroke(); c.fillRect(24, -84, 14, 7); }
        else { c.beginPath(); c.moveTo(0, -70); c.lineTo(10, -46); c.stroke(); }
        c.restore();
      };
      const meLeft = E.me === 0;
      drawCowboy(meLeft ? 260 : 700, E.colors[E.me], meLeft ? 1 : -1, myMs != null);
      drawCowboy(meLeft ? 700 : 260, E.colors[1 - E.me], meLeft ? -1 : 1, foeMs != null);
      // signal lamp
      c.textAlign = 'center';
      if (phase === 'wait') {
        c.fillStyle = '#e63946'; c.beginPath(); c.arc(480, 260, 34, 0, 7); c.fill();
        c.fillStyle = '#fff'; c.font = 'bold 30px system-ui'; c.fillText('WAIT FOR IT…', 480, 340);
      } else if (isGo) {
        c.fillStyle = '#3ddc84'; c.beginPath(); c.arc(480, 260, 44, 0, 7); c.fill();
        c.fillStyle = '#fff'; c.font = 'bold 44px system-ui'; c.fillText('DRAW!', 480, 348);
      }
      if (resultMsg) { c.fillStyle = '#ff8080'; c.font = 'bold 26px system-ui'; c.fillText(resultMsg, 480, 390); }
      // reaction times
      c.font = 'bold 20px system-ui';
      if (myMs != null && myMs < 99999) { c.fillStyle = E.colors[E.me]; c.fillText(`${myMs} ms`, meLeft ? 260 : 700, 470); }
      if (foeMs != null && foeMs < 99999) { c.fillStyle = E.colors[1 - E.me]; c.fillText(`${foeMs} ms`, meLeft ? 700 : 260, 470); }
      c.textAlign = 'left';
    },
  };
})());

</script>
<script>
// ---- DUEL ROOM engine: screens, lobby, rounds, scoring ----
(() => {
  const $ = (id) => document.getElementById(id);
  const cv = $('cv'), ctx = cv.getContext('2d');
  const FIRST_TO = 5;
  const COLORS = ['#4dc3ff', '#ff6b6b']; // 0 = host (blue), 1 = guest (red)

  let appState = 'menu';        // menu | wait | lobby | game
  let curGameId = null, game = null;
  let botsN = 0;                // Bomb Arena bots (synced between players)
  let holesN = 9;               // Minigolf hole count (synced between players)
  let hudOverride = null;       // games can take over the HUD line
  let score = [0, 0], round = 0, wins = {}; // wins[gameId] = [w0,w1]
  let roundTimers = [];
  let myCode = '';

  // ---------- engine context handed to games ----------
  const E = {
    W: 960, H: 540, ctx,
    me: 0, isHost: true,
    names: ['P1', 'P2'],
    colors: COLORS,
    keys: new Set(),
    mouse: { x: 480, y: 270, down: false },
    state: 'countdown',
    get playing() { return E.state === 'play'; },
    rand: Math.random,
    round: 0,
    gsend(d) { Net.send({ t: 'g', d }); },
    claimPoint(w) {
      if (E.state !== 'play') return;
      if (Net.isHost) applyPoint(w);
      else { E.state = 'claimed'; Net.send({ t: 'claim', w }); } // block double-claims client-side
    },
    setHud(text) { hudOverride = text; updateHUD(); },
    matchWin(w) { // for match-based games (golf): declare the overall winner
      if (E.state !== 'play') return;
      if (Net.isHost) { score[w] = FIRST_TO - 1; applyPoint(w); }
      else { E.state = 'claimed'; Net.send({ t: 'matchclaim', w }); }
    },
  };

  // ---------- screens ----------
  function show(scr) {
    document.querySelectorAll('.screen').forEach((s) => s.classList.remove('on'));
    $('gamescr').classList.remove('on');
    if (scr === 'game') $('gamescr').classList.add('on');
    else $('scr-' + scr).classList.add('on');
    appState = scr;
  }
  function toast(msg, ms = 2600) {
    const t = $('toast'); t.textContent = msg; t.style.display = 'block';
    clearTimeout(t._to); t._to = setTimeout(() => { t.style.display = 'none'; }, ms);
  }

  // ---------- menu ----------
  const CODE_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  function genCode() {
    let s = '';
    for (let i = 0; i < 4; i++) s += CODE_CHARS[Math.floor(Math.random() * CODE_CHARS.length)];
    return s;
  }
  function myName(fallback) {
    return ($('nameIn').value.trim() || fallback).slice(0, 12);
  }

  $('btnCreate').onclick = () => {
    SFX.unlock(); SFX.click();
    myCode = genCode();
    $('menuErr').textContent = '';
    Net.host(myCode, myName('Player 1'));
    $('roomCodeShow').textContent = myCode;
    const url = new URL(location.href);
    url.searchParams.set('room', myCode);
    $('linkShow').value = url.toString();
    show('wait');
  };
  $('btnJoin').onclick = () => {
    SFX.unlock(); SFX.click();
    const code = $('codeIn').value.trim().toUpperCase();
    if (code.length !== 4) { $('menuErr').textContent = 'Enter the 4-letter room code.'; return; }
    $('menuErr').textContent = 'Connecting…';
    Net.join(code, myName('Player 2'));
  };
  $('codeIn').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('btnJoin').click(); });
  $('btnCancelWait').onclick = () => { Net.leave(); show('menu'); };
  $('btnCopy').onclick = () => {
    const v = $('linkShow').value;
    if (navigator.clipboard) navigator.clipboard.writeText(v).then(() => toast('Link copied!'));
    else { $('linkShow').select(); document.execCommand('copy'); toast('Link copied!'); }
  };

  // prefill from invite link
  {
    const q = new URLSearchParams(location.search);
    const r = q.get('room');
    if (r) { $('codeIn').value = r.toUpperCase().slice(0, 4); $('nameIn').placeholder = 'Player 2'; }
  }

  // ---------- net events ----------
  Net.onReady(() => {
    E.me = Net.isHost ? 0 : 1;
    E.isHost = Net.isHost;
    E.names[E.me] = Net.myName;
    E.names[1 - E.me] = Net.peerName;
    $('menuErr').textContent = '';
    toast('Connected!');
    SFX.win();
    enterLobby();
  });
  Net.onNames(() => { if (appState === 'lobby') enterLobby(); });
  Net.onFail((msg) => {
    $('menuErr').textContent = msg;
    if (appState === 'wait') { show('menu'); }
  });
  Net.onDrop(() => {
    clearTimers();
    toast(E.names[1 - E.me] + ' disconnected');
    SFX.lose();
    Net.leave();
    show('menu');
  });
  Net.onMessage((m) => {
    switch (m.t) {
      case 'g': if (game && appState === 'game') game.onNet(m.d); break;
      case 'startreq': if (Net.isHost && appState === 'lobby') hostStartGame(m.game); break;
      case 'start': if (!Net.isHost) beginGame(m.game, m.seed, m.opts); break;
      case 'bots': botsN = m.n; syncBotChips(); break;
      case 'round': if (!Net.isHost && appState === 'game') startRound(m.seed, m.n); break;
      case 'score': if (!Net.isHost) { score = m.s.slice(); handleScored(m.w); } break;
      case 'claim': if (Net.isHost) applyPoint(m.w); break;
      case 'matchclaim': if (Net.isHost && E.state === 'play') { score[m.w] = FIRST_TO - 1; applyPoint(m.w); } break;
      case 'holes': holesN = m.n; syncHoleChips(); break;
      case 'quit': backToLobby(true); break;
    }
  });

  // ---------- lobby ----------
  function enterLobby() {
    E.names[E.me] = Net.myName; E.names[1 - E.me] = Net.peerName;
    $('lp1').textContent = E.names[0] + (E.me === 0 ? ' (you)' : '');
    $('lp2').textContent = E.names[1] + (E.me === 1 ? ' (you)' : '');
    buildCards();
    buildScore();
    show('lobby');
  }
  function buildCards() {
    const g = $('games'); g.innerHTML = '';
    for (const id of GAME_ORDER) {
      const G = GAMES[id];
      const d = document.createElement('div');
      d.className = 'gcard';
      d.innerHTML = `<div class="ico">${G.ico}</div><div class="nm">${G.name}</div><div class="ds">${G.desc}</div>`;
      if (id === 'golf') {
        const row = document.createElement('div');
        row.className = 'botrow';
        row.innerHTML = `<span class="botlbl">holes:</span>` +
          [9, 18, 30].map((n) => `<span class="botchip holechip${n === holesN ? ' onn' : ''}" data-h="${n}" style="width:auto;padding:0 7px">${n}</span>`).join('');
        row.querySelectorAll('.holechip').forEach((ch) => {
          ch.onclick = (ev) => {
            ev.stopPropagation();
            holesN = parseInt(ch.dataset.h, 10);
            syncHoleChips();
            Net.send({ t: 'holes', n: holesN });
            SFX.click();
          };
        });
        d.appendChild(row);
      }
      if (id === 'bomb') {
        const row = document.createElement('div');
        row.className = 'botrow';
        row.innerHTML = `<span class="botlbl">bots:</span>` +
          [0, 1, 2].map((n) => `<span class="botchip${n === botsN ? ' onn' : ''}" data-n="${n}">${n}</span>`).join('');
        row.querySelectorAll('.botchip').forEach((ch) => {
          ch.onclick = (ev) => {
            ev.stopPropagation();
            botsN = parseInt(ch.dataset.n, 10);
            syncBotChips();
            Net.send({ t: 'bots', n: botsN });
            SFX.click();
          };
        });
        d.appendChild(row);
      }
      d.onclick = () => {
        SFX.click();
        if (Net.isHost) hostStartGame(id);
        else Net.send({ t: 'startreq', game: id });
      };
      g.appendChild(d);
    }
  }
  function buildScore() {
    const tb = $('score');
    let html = `<tr><th>Game</th><th style="color:${COLORS[0]}">${E.names[0]}</th><th style="color:${COLORS[1]}">${E.names[1]}</th></tr>`;
    let t0 = 0, t1 = 0;
    for (const id of GAME_ORDER) {
      const w = wins[id] || [0, 0];
      t0 += w[0]; t1 += w[1];
      html += `<tr><td>${GAMES[id].ico} ${GAMES[id].name}</td><td>${w[0]}</td><td>${w[1]}</td></tr>`;
    }
    const lead = t0 === t1 ? '' : (t0 > t1 ? ` — ${E.names[0]} leads!` : ` — ${E.names[1]} leads!`);
    html += `<tr class="tot"><td>TOTAL${lead}</td><td>${t0}</td><td>${t1}</td></tr>`;
    tb.innerHTML = html;
  }

  // ---------- game flow ----------
  function clearTimers() { roundTimers.forEach(clearTimeout); roundTimers = []; }
  function later(fn, ms) { roundTimers.push(setTimeout(fn, ms)); }

  function syncBotChips() {
    document.querySelectorAll('.botchip[data-n]').forEach((ch) => {
      ch.classList.toggle('onn', parseInt(ch.dataset.n, 10) === botsN);
    });
  }
  function syncHoleChips() {
    document.querySelectorAll('.holechip').forEach((ch) => {
      ch.classList.toggle('onn', parseInt(ch.dataset.h, 10) === holesN);
    });
  }
  function hostStartGame(id) {
    if (!GAMES[id]) return;
    const seed = (Math.random() * 0x7fffffff) | 0;
    const opts = { bots: botsN, holes: holesN };
    Net.send({ t: 'start', game: id, seed, opts });
    beginGame(id, seed, opts);
  }
  function beginGame(id, seed, opts) {
    clearTimers();
    E.opts = opts || {};
    hudOverride = null;
    curGameId = id;
    game = GAMES[id];
    score = [0, 0]; round = 0;
    show('game');
    $('ctrlhint').textContent = game.controls;
    game.init(E);
    startRound(seed, 1);
  }
  function startRound(seed, n) {
    clearTimers();
    round = n; E.round = n;
    E.rand = makeRand(seed);
    E.state = 'countdown';
    game.newRound();
    updateHUD();
    banner(''); sub('');
    let c = 3;
    const tick = () => {
      if (appState !== 'game') return;
      if (c > 0) {
        banner('' + c); SFX.beep(); c--;
        later(tick, 550);
      } else {
        banner('GO!'); SFX.go();
        E.state = 'play';
        later(() => { if (E.state === 'play') banner(''); }, 500);
      }
    };
    tick();
  }

  function applyPoint(w) { // host only
    if (E.state !== 'play') return;
    score[w]++;
    Net.send({ t: 'score', s: score, w });
    handleScored(w);
  }
  function handleScored(w) {
    E.state = 'scored';
    updateHUD();
    const mine = w === E.me;
    if (mine) SFX.point(); else SFX.losePoint();
    banner(`+1 ${E.names[w]}`);
    sub(`${score[0]} — ${score[1]}`);
    if (score[w] >= FIRST_TO) {
      later(() => gameOver(w), 1100);
    } else if (Net.isHost) {
      later(() => {
        if (appState !== 'game') return;
        const seed = (Math.random() * 0x7fffffff) | 0;
        Net.send({ t: 'round', seed, n: round + 1 });
        startRound(seed, round + 1);
      }, 1700);
    }
  }
  function gameOver(w) {
    E.state = 'over';
    const mine = w === E.me;
    if (!wins[curGameId]) wins[curGameId] = [0, 0];
    wins[curGameId][w]++;
    banner(mine ? '🏆 YOU WIN!' : `${E.names[w]} WINS`);
    sub(mine ? 'Absolute legend.' : 'Revenge in the lobby…');
    if (mine) SFX.win(); else SFX.lose();
    later(() => backToLobby(false), 3000);
  }
  function backToLobby(fromQuit) {
    if (appState !== 'game') return;
    clearTimers();
    game = null; curGameId = null;
    banner(''); sub('');
    if (fromQuit) toast('Back to the lobby');
    enterLobby();
  }
  $('quitbtn').onclick = () => {
    if (appState !== 'game') return;
    Net.send({ t: 'quit' });
    backToLobby(true);
  };

  function banner(t) {
    const b = $('banner');
    if (b.textContent !== t) { b.textContent = t; b.classList.remove('flash'); void b.offsetWidth; if (t) b.classList.add('flash'); }
  }
  function sub(t) { $('subbanner').textContent = t; }
  function updateHUD() {
    if (hudOverride != null) {
      $('hud').innerHTML = `<span style="font-size:19px;font-weight:800;color:var(--txt)">${hudOverride}</span>`;
      return;
    }
    $('hud').innerHTML =
      `<span class="hn" style="color:${COLORS[0]}">${E.names[0]}</span>` +
      `<span style="color:${COLORS[0]}">${score[0]}</span>` +
      `<span style="color:var(--dim);font-size:16px">round ${round}</span>` +
      `<span style="color:${COLORS[1]}">${score[1]}</span>` +
      `<span class="hn" style="color:${COLORS[1]}">${E.names[1]}</span>`;
  }

  // ---------- input ----------
  function mousePos(ev) {
    const r = cv.getBoundingClientRect();
    return { x: (ev.clientX - r.left) * (960 / r.width), y: (ev.clientY - r.top) * (540 / r.height) };
  }
  // listen on window so drags keep working outside the canvas (e.g. golf power pull)
  window.addEventListener('mousemove', (ev) => {
    const p = mousePos(ev);
    E.mouse.x = p.x; E.mouse.y = p.y;
    if (game && game.onMove) game.onMove(p.x, p.y);
  });
  cv.addEventListener('mousedown', (ev) => {
    ev.preventDefault();
    SFX.unlock();
    const p = mousePos(ev);
    E.mouse.down = true; E.mouse.x = p.x; E.mouse.y = p.y;
    if (game && appState === 'game' && game.onDown) game.onDown(p.x, p.y, ev.button);
  });
  window.addEventListener('mouseup', (ev) => {
    E.mouse.down = false;
    if (game && appState === 'game' && game.onUp) {
      const p = mousePos(ev);
      game.onUp(p.x, p.y);
    }
  });
  cv.addEventListener('contextmenu', (ev) => ev.preventDefault());
  window.addEventListener('keydown', (ev) => {
    if (ev.repeat) return;
    const k = ev.key.toLowerCase();
    E.keys.add(k);
    if (game && appState === 'game' && game.onKey) game.onKey(k === ' ' ? ' ' : k);
    if ([' ', 'arrowup', 'arrowdown'].includes(k)) ev.preventDefault();
  });
  window.addEventListener('keyup', (ev) => E.keys.delete(ev.key.toLowerCase()));
  window.addEventListener('blur', () => E.keys.clear());

  // ---------- canvas scaling ----------
  function fit() {
    const s = Math.min(window.innerWidth / 1000, (window.innerHeight - 90) / 580, 1.25);
    cv.style.transform = `translate(-50%,-50%) scale(${Math.max(0.4, s)})`;
  }
  window.addEventListener('resize', fit); fit();

  // ---------- main loop ----------
  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.04, (now - last) / 1000);
    last = now;
    if (appState === 'game' && game) {
      // 'claimed' behaves like frozen play while host confirms
      game.update(dt);
      game.draw();
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  // ---------- debug/test hooks (only with ?dev in URL) ----------
  if (new URLSearchParams(location.search).has('dev')) {
    window.__DR = {
      get appState() { return appState; },
      get state() { return E.state; },
      get score() { return score.slice(); },
      get round() { return round; },
      get game() { return curGameId; },
      get wins() { return JSON.parse(JSON.stringify(wins)); },
      get ping() { return Net.ping; },
      get names() { return E.names.slice(); },
      get connected() { return Net.connected; },
      testPoint(w) { E.claimPoint(w); },
      testMatchWin(w) { E.matchWin(w); },
      get g() { return game && game.dbg ? game.dbg() : null; },
    };
  }

  // ---------- ping display ----------
  setInterval(() => {
    $('pingbox').textContent = Net.connected ? `ping ${Net.ping == null ? '—' : Net.ping + ' ms'} · P2P` : '';
  }, 1000);
})();

</script>
</body>
</html>
